# Every account the ledger defines, unfiltered: cash membership is resolved
# from these before any activity is read, because a filtered report's closing
# hierarchy can hold no cash account at all (w4/m56).
query GetLedgerCashFlowAccounts($ledgerId: String!) {
  getLedgerAccountDirectives(ledgerId: $ledgerId) {
    account
    openedAt
    closedAt
    balance
    entryCount
    entryHash
    closeEntryHash
    meta
  }
}

query GetLedgerCashFlow(
  $ledgerId: String!
  $interval: String!
  $conversion: String!
  $time: String
  # The reader's filter, for the closing cash balances.
  $filter: String
  # That filter restricted to transactions with a cash posting
  # (cashActivityFilter), for the activity intervals.
  $activityFilter: String!
  $account: String
  # The ledger's own root names (option "name_income" etc.); the producer
  # reads accountName as a prefix, so English literals missed renamed roots
  # (w4/1022).
  $incomeRoot: String!
  $expensesRoot: String!
  $assetsRoot: String!
  $liabilitiesRoot: String!
  $equityRoot: String!
) {
  incomeIntervals: getLedgerIntervalTotals(
    accountName: $incomeRoot
    ledgerId: $ledgerId
    interval: $interval
    conversion: $conversion
    time: $time
    filter: $activityFilter
    account: $account
  ) {
    date
    balance
    accountBalances
  }
  expenseIntervals: getLedgerIntervalTotals(
    accountName: $expensesRoot
    ledgerId: $ledgerId
    interval: $interval
    conversion: $conversion
    time: $time
    filter: $activityFilter
    account: $account
  ) {
    date
    balance
    accountBalances
  }
  assetIntervals: getLedgerIntervalTotals(
    accountName: $assetsRoot
    ledgerId: $ledgerId
    interval: $interval
    conversion: $conversion
    time: $time
    filter: $activityFilter
    account: $account
  ) {
    date
    balance
    accountBalances
  }
  liabilityIntervals: getLedgerIntervalTotals(
    accountName: $liabilitiesRoot
    ledgerId: $ledgerId
    interval: $interval
    conversion: $conversion
    time: $time
    filter: $activityFilter
    account: $account
  ) {
    date
    balance
    accountBalances
  }
  equityIntervals: getLedgerIntervalTotals(
    accountName: $equityRoot
    ledgerId: $ledgerId
    interval: $interval
    conversion: $conversion
    time: $time
    filter: $activityFilter
    account: $account
  ) {
    date
    balance
    accountBalances
  }
  getLedgerBalanceSheet(
    ledgerId: $ledgerId
    conversion: $conversion
    time: $time
    filter: $filter
    account: $account
  ) {
    assetsHierarchyData {
      account
      balance
      balanceChildren
      children
      hasTxns
      cost
      costChildren
    }
  }
}
