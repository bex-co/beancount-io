query GetLedgerCashFlow(
  $ledgerId: String!
  $interval: String!
  $conversion: String!
  $time: String
  $filter: String
  $account: String
  # The ledger's own root names (option "name_income" etc.); the producer
  # reads accountName as a prefix, so English literals missed renamed roots
  # (w4/1022).
  $incomeRoot: String!
  $expensesRoot: String!
  $assetsRoot: String!
  $liabilitiesRoot: String!
  $equityRoot: String!
) {
  incomeIntervals: getLedgerIntervalTotals(
    accountName: $incomeRoot
    ledgerId: $ledgerId
    interval: $interval
    conversion: $conversion
    time: $time
    filter: $filter
    account: $account
  ) {
    date
    balance
    accountBalances
  }
  expenseIntervals: getLedgerIntervalTotals(
    accountName: $expensesRoot
    ledgerId: $ledgerId
    interval: $interval
    conversion: $conversion
    time: $time
    filter: $filter
    account: $account
  ) {
    date
    balance
    accountBalances
  }
  assetIntervals: getLedgerIntervalTotals(
    accountName: $assetsRoot
    ledgerId: $ledgerId
    interval: $interval
    conversion: $conversion
    time: $time
    filter: $filter
    account: $account
  ) {
    date
    balance
    accountBalances
  }
  liabilityIntervals: getLedgerIntervalTotals(
    accountName: $liabilitiesRoot
    ledgerId: $ledgerId
    interval: $interval
    conversion: $conversion
    time: $time
    filter: $filter
    account: $account
  ) {
    date
    balance
    accountBalances
  }
  equityIntervals: getLedgerIntervalTotals(
    accountName: $equityRoot
    ledgerId: $ledgerId
    interval: $interval
    conversion: $conversion
    time: $time
    filter: $filter
    account: $account
  ) {
    date
    balance
    accountBalances
  }
  getLedgerBalanceSheet(
    ledgerId: $ledgerId
    conversion: $conversion
    time: $time
    filter: $filter
    account: $account
  ) {
    assetsHierarchyData {
      account
      balance
      balanceChildren
      children
      hasTxns
      cost
      costChildren
    }
  }
  getLedgerAccountDirectives(ledgerId: $ledgerId) {
    account
    openedAt
    closedAt
    balance
    entryCount
    entryHash
    closeEntryHash
    meta
  }
}
