query GetSubscriptionStatus {
  subscriptionStatus {
    subscriptions {
      __typename
      id
      status
      currentPeriodStart
      currentPeriodEnd
      clientId
      cancelAt
      canceledAt
      cancelAtPeriodEnd
      items {
        id
        price {
          id
          amount
          currency
          interval
          intervalCount
          trialPeriodDays
        }
        quantity
        product {
          id
          name
          description
          images
        }
      }
      paymentMethod {
        brand
        last4
      }
      nextPaymentAttempt
      latestInvoice {
        id
        amountPaid
        currency
        billingReason
        created
      }
      scheduledChange {
        priceId
        effectiveAt
      }
    }
    hasActiveSubscription
    billing {
      source
      duplicateBilling
      store {
        provider
        tier
        interval
        status
        accessEndsAt
        willRenew
        managementUrl
        scheduledChange {
          tier
          interval
        }
      }
    }
  }
}

# Who bills the plan, without Stripe's products and cards: the backend answers
# it without the full Stripe read, so a banner can ask on every page.
query GetBillingStatus {
  subscriptionStatus {
    hasActiveSubscription
    billing {
      source
      duplicateBilling
      store {
        provider
        status
        willRenew
        managementUrl
      }
    }
  }
}

query GetAllTierQuotas {
  allTierQuotas {
    tier
    aiCfoTokensMax
    maxLedgers
    maxCollaboratorsPerLedger
    maxDirectives
  }
}

query PreviewPlanChange($clientId: String!, $priceId: String!) {
  previewPlanChange(clientId: $clientId, priceId: $priceId) {
    kind
    storeOverlap {
      provider
      endsAt
      deferred
    }
    refusal
    effect
    currentPriceId
    targetPriceId
    currency
    amountDueToday
    creditApplied
    nextAmount
    nextChargeAt
    effectiveAt
    prorationDate
    alternativePriceId
    limitChanges {
      limit
      from
      to
    }
    paymentMethod {
      brand
      last4
    }
    replacesScheduledChange {
      priceId
      effectiveAt
    }
    withdrawsCancellation
  }
}
