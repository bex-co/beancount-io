# Copy to .github/workflows/ledger-check.yml in your ledger repository.
name: Ledger checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LEDGER_FILE: main.bean
  BEA_VERSION: "0.3.0"

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          enable-cache: false
      - name: Install bea
        run: |
          uv tool install --python 3.12 "beancount-io==$BEA_VERSION"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Validate ledger
        run: bea --no-input --file "$LEDGER_FILE" check
      - name: Check formatting
        run: bea --no-input format "$LEDGER_FILE" --check
