[project]
name = "beancount-io"
version = "0.2.0"
description = "Beancount.io CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "prompt-toolkit>=3.0",
    "python-frontmatter>=1.1",
    "attrs>=23",
]

[project.optional-dependencies]
# `bea ask` is the only command that needs an LLM client. Keeping these out of
# the default install means a first `bea check` downloads and imports neither.
ask = [
    "openai>=1.0",
    "pydantic-ai>=0.3",
]

[project.urls]
Homepage = "https://beancount.io"
Repository = "https://github.com/bex-co/beancount-io"

[project.scripts]
bea = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ADR014 t023: customer frontend wheel is MIT UX only — no bea_engine, no Fava.
# Engine code ships in `beancount-io-engine` (`engine/pyproject.toml`).
# `engine-requirements.lock` ships inside the package so first-use provisioning
# can `--require-hashes` without a second download of the lock itself.
[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

# Editable installs must work before the release locks have been generated.
# Standard wheels require all locks; the hook fails closed when one is absent.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/build_hook.py"

# The sdist is what the Homebrew formula builds from, so it must carry
# `requirements.lock` — the hash-pinned export of this release's resolution,
# generated by `make release-lock` and never committed. `ignore-vcs` is what
# lets a gitignored generated file into the archive; `only-include` is then the
# whole definition of an sdist, so nothing untracked (including `tmp/`) slips in.
#
# `engine/src` is a checkout symlink to `../src`. Hatchling follows that symlink
# and dedupes by inode — because `engine` sorts before `src`, a plain `include`
# of both keeps only `engine/src` and drops the frontend tree, so `uv build`
# (sdist → wheel) publishes an empty wheel. `only-include` keeps real `src/`;
# `force-include` copies the engine-needed trees into `engine/src` so
# `pip install engine/` from the unpacked sdist still works.
[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [
    "src",
    "tests",
    "docs",
    "openapi",
    "scripts",
    "engine/pyproject.toml",
    "engine/NOTICE.fava",
    "engine/LICENSE",
    "Makefile",
    "NOTICE.fava",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "uv.lock",
    "requirements.lock",
    "engine-requirements.lock",
    "engine-optional-beangulp.lock",
    "engine-optional-beanprice.lock",
]
exclude = ["**/__pycache__", "**/*.py[co]"]

[tool.hatch.build.targets.sdist.force-include]
"src/bea_engine" = "engine/src/bea_engine"
"src/fava" = "engine/src/fava"

[dependency-groups]
dev = [
    "beancount-io[ask]",
    # Checkout/test path runs the engine helper with this interpreter; keep the
    # Beancount stack here so `bean-check` and `import beancount` work in CI
    # without putting them on the customer frontend graph.
    "beancount>=3.2",
    "beanquery>=0.2",
    "ply>=3.11",
    "pyexcel>=0.7.3",
    "python-dateutil>=2.9.0",
    "pytest>=8",
    "pytest-httpx>=0.30",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.12",
    "mypy>=1.17.1",
    "types-python-dateutil>=2.9.0.20251008",
    "vulture>=2.14",
    "openapi-python-client>=0.29.1",
    "pytest-xdist>=3.6",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["src/cli/api/rest_client/", "src/cli/commands/cloud/generated/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/bea_engine/ledger/writer.py" = ["I001"]
"src/fava/**/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Engine and Fava live beside the frontend in `src/` but are not installed into
# the frontend package; tests that import them need the shared tree on path.
pythonpath = ["src"]
