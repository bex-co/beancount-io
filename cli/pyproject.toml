[project]
name = "beancount-cli"
version = "0.1.0"
description = "CLI for the Beancount.io platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "beancount>=3.2",
    "beanquery>=0.2",
    "ply>=3.11",
    "pyexcel>=0.7.3",
    "python-dateutil>=2.9.0",
    "openai>=1.0",
    "pydantic-ai>=0.3",
    "prompt-toolkit>=3.0",
    "python-frontmatter>=1.1",
]

[project.urls]
Homepage = "https://beancount.io"
Repository = "https://github.com/bex-co/beancount-io"

[project.scripts]
beancount-cli = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/fava"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.12",
    "mypy>=1.17.1",
    "ariadne-codegen>=0.14",
    "types-python-dateutil>=2.9.0.20251008",
]

[tool.ariadne-codegen]
schema_path = "graphql/schema.graphql"
queries_path = "graphql/operations/"
target_package_name = "gql_client"
target_package_path = "src/cli/api"
async_client = false

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["src/cli/api/gql_client/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/cli/directives/writer.py" = ["I001"]
"src/fava/**/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
