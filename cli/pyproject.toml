[project]
name = "beancount-io"
version = "0.1.0"
description = "Beancount.io CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "beancount>=3.2",
    "beanquery>=0.2",
    "ply>=3.11",
    "pyexcel>=0.7.3",
    "python-dateutil>=2.9.0",
    "prompt-toolkit>=3.0",
    "python-frontmatter>=1.1",
    "attrs>=23",
]

[project.optional-dependencies]
# `bea ask` is the only command that needs an LLM client. Keeping these out of
# the default install means a first `bea check` downloads and imports neither.
ask = [
    "openai>=1.0",
    "pydantic-ai>=0.3",
]

[project.urls]
Homepage = "https://beancount.io"
Repository = "https://github.com/bex-co/beancount-io"

[project.scripts]
bea = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/fava"]

# The sdist is what the Homebrew formula builds from, so it must carry
# `requirements.lock` — the hash-pinned export of this release's resolution,
# generated by `make release-lock` and never committed. `ignore-vcs` is what
# lets a gitignored generated file into the archive; the include list below is
# then the whole definition of an sdist, so nothing untracked slips in with it.
[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = [
    "src/",
    "tests/",
    "docs/",
    "openapi/",
    "scripts/",
    "Makefile",
    "NOTICE.fava",
    "README.md",
    "pyproject.toml",
    "uv.lock",
    "requirements.lock",
]
exclude = ["**/__pycache__", "**/*.py[co]"]

[dependency-groups]
dev = [
    "beancount-io[ask]",
    "pytest>=8",
    "pytest-httpx>=0.30",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.12",
    "mypy>=1.17.1",
    "types-python-dateutil>=2.9.0.20251008",
    "vulture>=2.14",
    "openapi-python-client>=0.29.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["src/cli/api/rest_client/", "src/cli/commands/cloud/generated/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/cli/directives/writer.py" = ["I001"]
"src/fava/**/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
