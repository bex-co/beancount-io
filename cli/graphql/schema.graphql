type Mutation {
  """delete user account and its associated data"""
  deleteAccount: Boolean!
  updateUsername(username: String!): UserProfileResponse!

  """Update user profile (firstName and lastName)"""
  updateProfile(firstName: String, lastName: String): UserProfileResponse!

  """Logout user, revoke JWT token and clear httpOnly cookie"""
  logout: LogoutResponse!
  signIn(email: String!, password: String!): TokenAuthResponse!

  """
  Refresh authentication token - issues a new token and revokes the current one
  """
  refreshToken: TokenAuthResponse!
  signInWithOneTimeToken(token: String!): TokenAuthResponse!
  createOneTimeToken: CreateOneTimeTokenResponse!

  """Send a password reset link to the user's email"""
  sendForgotPasswordLink(email: String!): SendForgotPasswordLinkResponse!

  """Reset user password using a token from the password reset email"""
  resetPassword(token: String!, newPassword: String!): ResetPasswordResponse!

  """
  Start signup by creating an OTP session. Sends a verification code to the user's email.
  """
  signUp(email: String!, password: String!, firstName: String!, lastName: String!, username: String, inviteSrc: String, inviteBy: String, withDefaultLedger: Boolean): SignUpResponse!

  """Verify OTP and create user account to complete signup"""
  verifySignUpOtp(sessionId: String!, otp: String!): TokenAuthResponse!

  """
  Initiate a CLI authentication session. Returns the device code the CLI polls with and the user code to display for the person to enter in the browser.
  """
  createCliAuthSession(client: CliAuthClientInfoInput): CreateCliAuthSessionResponse!

  """
  Authorize the pending CLI session a user code names. Issues a JWT for the CLI and stores it for the matching device code to collect.
  """
  confirmCliAuthSession(userCode: String!): ConfirmCliAuthSessionResponse!

  """Deny the pending CLI authentication request a user code names."""
  denyCliAuthSession(userCode: String!): DenyCliAuthSessionResponse!

  """
  Retrieve and consume the token from an authorized CLI auth session. Single-use, and only redeemable by the device code the session was created with.
  """
  consumeCliAuthSession(deviceCode: String!): ConsumeCliAuthSessionResponse!

  """Create a new ledger for the current user"""
  createLedger(name: String!, description: String, private: Boolean, template: LedgerTemplate): Ledger!

  """Update a specific ledger"""
  updateLedger(name: String, description: String, private: Boolean, ledgerId: String!): Ledger!

  """Delete a specific ledger"""
  deleteLedger(ledgerId: String!): DeleteLedgerResponse!

  """Create a new file in a specific ledger"""
  createLedgerFile(path: String!, content: String!, message: String, ledgerId: String!): LedgerFileContent!

  """Update an existing file in a specific ledger"""
  updateLedgerFile(path: String!, content: String!, sha: String!, message: String, ledgerId: String!): LedgerFileContent!

  """Delete a file from a specific ledger"""
  deleteLedgerFile(path: String!, sha: String!, message: String, ledgerId: String!): DeleteLedgerFileResponse!

  """Rename a file in a specific ledger"""
  renameLedgerFile(newPath: String!, oldPath: String!, message: String, ledgerId: String!): RenameLedgerFileResponse!

  """Star a specific ledger"""
  starLedger(ledgerId: String!): StarLedgerResponse!

  """Unstar a specific ledger"""
  unstarLedger(ledgerId: String!): StarLedgerResponse!

  """
  Creates a Stripe-hosted checkout session. Requires a full signed-in session.
  """
  createSubscriptionSession(priceId: String!, clientId: String!): SubscriptionSessionResult!

  """
  Creates a Stripe-hosted customer portal session. Requires a full signed-in session.
  """
  createStripePortalSession(clientId: String!): SubscriptionSessionResult!

  """
  Schedules your subscription to cancel. Requires a full signed-in session.
  """
  cancelSubscription(clientId: String!, subscriptionId: String!): SubscriptionActionResult!

  """Resumes your subscription. Requires a full signed-in session."""
  resumeSubscription(clientId: String!, subscriptionId: String!): SubscriptionActionResult!

  """Upgrades your subscription. Requires a full signed-in session."""
  upgradeSubscription(priceId: String!, clientId: String!): UpgradeSubscriptionResult!

  """Create a new public key for the current user"""
  createPublicKey(key: String!, title: String!, readOnly: Boolean = false): PublicKey!

  """Delete a specific public key by ID"""
  deletePublicKey(keyId: Float!): DeletePublicKeyResponse!
  addOrUpdateLedgerCollaborator(ledgerId: String!, collaborator: String!, permission: String): AddCollaboratorResponse!
  deleteLedgerCollaborator(ledgerId: String!, collaborator: String!): DeleteCollaboratorResponse!
  leaveLedger(ledgerId: String!): DeleteCollaboratorResponse!

  """Add one or more entries to a specific ledger (atomic)"""
  bulkEntries(entries: [AddEntryInput!]!, ledgerId: String!): AddLedgerEntryResponse!

  """
  Upload a receipt and insert a transaction entry. Storage strategy (S3 or git) is controlled by the `receipt_storage` beancountio-option.
  """
  insertReceiptTransaction(input: InsertReceiptTransactionInput!, receiptObjectKey: String!, ledgerId: String!): InsertReceiptResult!

  """Delete a source slice for a specific journal entry"""
  deleteLedgerEntrySourceSlice(input: DeleteSourceSliceInput!, ledgerId: String!): DeleteSourceSliceResponse!

  """
  Delete multiple source slices for journal entries in a single operation
  """
  deleteMultipleLedgerEntrySourceSlices(input: DeleteMultiSourceSlicesInput!, ledgerId: String!): DeleteMultiSourceSlicesResponse!

  """Update a source slice for a specific journal entry"""
  updateLedgerEntrySourceSlice(input: UpdateSourceSliceInput!, ledgerId: String!): UpdateSourceSliceResponse!
  addEntries(entriesInput: [EntryInput!]!, ledgerId: String): AddEntryResponse!

  """Follow a user"""
  followUser(
    """Username to follow"""
    username: String!
  ): FollowUserResponse!

  """Unfollow a user"""
  unfollowUser(
    """Username to follow"""
    username: String!
  ): FollowUserResponse!
  createPullRequestFromPatch(input: CreatePRFromPatchInput!): PullRequestResult!
  approvePullRequest(prNumber: Int!, ledgerName: String!, ledgerOwner: String!): PullRequestResult!
  rejectPullRequest(prNumber: Int!, ledgerName: String!, ledgerOwner: String!): PullRequestResult!

  """
  Parse an uploaded file (multimodal support for PDF/images/any format) into structured transactions. File must be uploaded to S3 first.
  """
  parseFile(
    """File format type (e.g., csv, pdf, xlsx, json, etc.)"""
    fileFormat: String!

    """S3 object key from upload"""
    s3ObjectKey: String!
  ): FileParseResult!

  """
  Parse a receipt image or PDF and return a single summarized transaction with account recommendations. File must be uploaded to S3 first.
  """
  parseReceipt(
    """Ledger ID used to fetch available accounts for recommendation"""
    ledgerId: String!

    """S3 object key of the receipt (image or PDF only)"""
    s3ObjectKey: String!
  ): ReceiptParseResult!
  generateTempAssetUploadUrl(filename: String, mimeType: String): TempAssetUploadUrl!

  """Create a Plaid Link token for connecting bank accounts"""
  createPlaidLinkToken(ledgerId: String!): PlaidLinkToken!

  """Create a Plaid Link token in update mode for reauthentication"""
  createPlaidUpdateModeLinkToken(
    """
    Request Plaid's Account Select pane so the user can add or remove accounts. A no-op at OAuth institutions, which always show it in update mode.
    """
    accountSelection: Boolean = false
    ledgerId: String!
    itemId: String!
  ): PlaidLinkToken!

  """
  Re-read the accounts Plaid shares for an Item and reconcile them against stored accounts. Call this after an update-mode Link session with Account Select.
  """
  reconcilePlaidAccounts(ledgerId: String!, itemId: String!): PlaidAccountReconcileResult!

  """Exchange Plaid public token for access token and store Item"""
  exchangePlaidPublicToken(publicToken: String!, ledgerId: String!): PlaidItemType!

  """Update the ledger account mapping for a Plaid account"""
  updatePlaidAccountMapping(ledgerId: String!, ledgerAccount: String!, accountId: String!): Boolean!

  """Update the currency used for a Plaid account's transactions"""
  updatePlaidAccountCurrency(ledgerId: String!, currency: String!, accountId: String!): Boolean!

  """
  Refresh Plaid Item status from Plaid API (useful after reauthentication)
  """
  refreshPlaidItemStatus(ledgerId: String!, itemId: String!): PlaidItemType!

  """Unlink a Plaid Item (remove from Plaid and delete from database)"""
  unlinkPlaidItem(ledgerId: String!, itemId: String!): Boolean!

  """Manually sync transactions for a specific Plaid Item"""
  syncPlaidTransactions(ledgerId: String!, itemId: String!): PlaidSyncResult!

  """Submit Plaid transactions with user-reviewed target accounts to ledger"""
  submitPlaidTransactionsToLedger(
    """
    Existing ledger file to write the transactions to; defaults to main.bean
    """
    filename: String
    transactions: [PlaidTransactionSubmitInput!]!
    ledgerId: String!
  ): PlaidSubmitResult!

  """Delete pending (unsynced) Plaid transactions from the review list"""
  deletePlaidTransactions(transactionIds: [String!]!, ledgerId: String!): PlaidDeleteResult!

  """Mint an API key. Requires a paid plan; an API key cannot mint another."""
  createApiKey(input: CreateApiKeyInputType!): MintedApiKeyType!

  """Revoke an API key, effective on its next use"""
  revokeApiKey(id: String!): ApiKeyType!
}

