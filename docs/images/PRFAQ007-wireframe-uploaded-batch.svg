<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <title>PRFAQ007 wireframe: uploaded remittance batch</title>
  <desc>The first screen after uploading a lockbox batch or an EDI file that holds many payments. Each payment lists its payer, source, amount, the invoices it pays and a status. The batch total is checked against the bank deposit. Payments that need a decision are listed first.</desc>
  <rect width="1100" height="600" fill="#ffffff"/>
  <rect x="20" y="20" width="1060" height="560" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="44" y="58" font-size="18" font-weight="600">Uploaded batch · 14 payments read</text>
  <rect x="896" y="38" width="160" height="32" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="976" y="59" text-anchor="middle">Upload another file</text>

  <rect x="44" y="86" width="1012" height="74" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="62" y="112" font-weight="600">Lockbox batch · Nov 20</text>
  <text x="240" y="112" fill="#57606a">14 payments · 41,280.00 USD</text>
  <rect x="800" y="96" width="240" height="24" rx="12" fill="#eefbf1" stroke="#2f8f4e"/>
  <text x="920" y="113" text-anchor="middle" fill="#2f8f4e" font-size="12">Agrees with bank deposit 41,280.00</text>
  <text x="62" y="142"><tspan font-weight="600">11 matched</tspan> automatically · <tspan font-weight="600">2 need a decision</tspan> · <tspan font-weight="600">1 has no invoice</tspan></text>

  <rect x="44" y="176" width="1012" height="340" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <g font-size="11" font-weight="600" fill="#57606a">
    <text x="62" y="200">PAYER</text><text x="330" y="200">SOURCE</text><text x="560" y="200" text-anchor="end">AMOUNT</text><text x="590" y="200">INVOICES PAID</text><text x="850" y="200">STATUS</text>
  </g>
  <line x1="62" y1="210" x2="1038" y2="210" stroke="#8c959f"/>

  <text x="62" y="238" font-weight="600">Acme Corp</text><text x="330" y="238" fill="#57606a">Image · check 10482</text><text x="560" y="238" text-anchor="end">1,960.00</text><text x="590" y="238">INV-101, INV-102</text>
  <rect x="850" y="222" width="150" height="22" rx="11" fill="#fff8e5" stroke="#bf8700"/><text x="925" y="238" text-anchor="middle" fill="#9a6700" font-size="12">Short by 40.00</text><text x="1038" y="238" text-anchor="end" fill="#57606a">▸</text>
  <line x1="62" y1="254" x2="1038" y2="254" stroke="#d0d7de"/>

  <text x="62" y="282" font-weight="600">Evergreen Co</text><text x="330" y="282" fill="#57606a">Image · check 5540</text><text x="560" y="282" text-anchor="end">2,000.00</text><text x="590" y="282">INV-095 (already paid Nov 12)</text>
  <rect x="850" y="266" width="150" height="22" rx="11" fill="#fff8e5" stroke="#bf8700"/><text x="925" y="282" text-anchor="middle" fill="#9a6700" font-size="12">Possible duplicate</text><text x="1038" y="282" text-anchor="end" fill="#57606a">▸</text>
  <line x1="62" y1="298" x2="1038" y2="298" stroke="#d0d7de"/>

  <text x="62" y="326" font-weight="600">Payer not recognized</text><text x="330" y="326" fill="#57606a">Image · check 2209</text><text x="560" y="326" text-anchor="end">725.00</text><text x="590" y="326" fill="#57606a">None named · 2 suggestions</text>
  <rect x="850" y="310" width="150" height="22" rx="11" fill="#fff8e5" stroke="#bf8700"/><text x="925" y="326" text-anchor="middle" fill="#9a6700" font-size="12">No invoice found</text><text x="1038" y="326" text-anchor="end" fill="#57606a">▸</text>
  <line x1="62" y1="342" x2="1038" y2="342" stroke="#d0d7de"/>

  <text x="62" y="370" font-weight="600">Borealis Ltd</text><text x="330" y="370" fill="#57606a">Image · check 3318</text><text x="560" y="370" text-anchor="end">12,400.00</text><text x="590" y="370">8 invoices</text>
  <rect x="850" y="354" width="150" height="22" rx="11" fill="#eefbf1" stroke="#2f8f4e"/><text x="925" y="370" text-anchor="middle" fill="#2f8f4e" font-size="12">Matched</text><text x="1038" y="370" text-anchor="end" fill="#57606a">▸</text>
  <line x1="62" y1="386" x2="1038" y2="386" stroke="#d0d7de"/>

  <text x="62" y="414" font-weight="600">Cedar Supply</text><text x="330" y="414" fill="#57606a">Image · check 7731</text><text x="560" y="414" text-anchor="end">500.00</text><text x="590" y="414">INV-103</text>
  <rect x="850" y="398" width="150" height="22" rx="11" fill="#eefbf1" stroke="#2f8f4e"/><text x="925" y="414" text-anchor="middle" fill="#2f8f4e" font-size="12">Matched</text><text x="1038" y="414" text-anchor="end" fill="#57606a">▸</text>
  <line x1="62" y1="430" x2="1038" y2="430" stroke="#d0d7de"/>

  <text x="62" y="458" font-weight="600">Delta Holdings</text><text x="62" y="476" fill="#57606a" font-size="12">pays for Delta West</text><text x="330" y="458" fill="#57606a">Image · check 9024</text><text x="560" y="458" text-anchor="end">3,150.00</text><text x="590" y="458">INV-088, INV-090</text>
  <rect x="850" y="442" width="150" height="22" rx="11" fill="#eefbf1" stroke="#2f8f4e"/><text x="925" y="458" text-anchor="middle" fill="#2f8f4e" font-size="12">Matched</text><text x="1038" y="458" text-anchor="end" fill="#57606a">▸</text>
  <text x="62" y="502" fill="#57606a">8 more matched payments</text>

  <rect x="876" y="530" width="180" height="34" rx="6" fill="#1f2328"/>
  <text x="966" y="552" text-anchor="middle" fill="#ffffff" font-weight="600">Record 11 matched</text>
  <text x="44" y="552" fill="#57606a">Payments that need a decision are listed first. Open one to see its image.</text>
</svg>
