<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 918" width="1280" height="918" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
  <title>ADR028 wireframe: bank transactions review</title>
  <desc>Wireframe of the bank transactions page. A summary says what automatic import did. A first list holds rows that need a decision, each with its candidate entries and two choices: same purchase, or new entry. A second list holds rows to categorize, each showing the bank’s own text beside an editable payee, narration and category filled from history or AI, bulk targets, submit and discard. A third list shows entries AI booked that still need confirming. A fourth shows what was imported automatically, with an undo.</desc>
