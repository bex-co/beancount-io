  <rect width="1440" height="640" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" fill="#1f2328" font-weight="600">ADR026 · 1 — Sign-up and landing</text>
  <text x="30" y="58" font-size="12" fill="#57606a">Where a newcomer arrives after signing up or signing in.</text>
  <rect x="30" y="86" width="680" height="30" rx="6" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
  <text x="44" y="106" font-size="13" fill="#1f2328" font-weight="600">Before — as built on 2026-11-09</text>
