  <line x1="1268" y1="323.0" x2="1287" y2="323.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="870" y="366" font-size="10" fill="#57606a">unchanged for now: whether it asks for a starter or currency is open question 4</text>
