  <text x="878" y="318" font-size="11" fill="#1f2328" font-weight="600">Consent sign-up</text>
  <text x="878" y="334" font-size="10" fill="#57606a">withDefaultLedger</text>
  <rect x="1010" y="300" width="118" height="46" rx="6" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1"/>
  <text x="1018" y="318" font-size="11" fill="#1f2328" font-weight="600">Server</text>
  <text x="1018" y="334" font-size="10" fill="#57606a">createDefaultLedger</text>
