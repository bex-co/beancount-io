  <line x1="988" y1="413" x2="1015" y2="413" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1130" y="376" width="270" height="22" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/>
  <text x="1138" y="391" font-size="10" fill="#1f2328">next → that page; /ledger with 0 ledgers → Welcome</text>
  <path d="M1086,413 C1106,413 1110,387 1127,387" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1130" y="402" width="190" height="22" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/>
