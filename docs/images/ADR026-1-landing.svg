  <rect x="1290" y="134" width="118" height="46" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/>
  <text x="1298" y="152" font-size="11" fill="#1f2328" font-weight="600">Ledger overview</text>
  <line x1="1268" y1="157.0" x2="1287" y2="157.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="730" y="224" font-size="12" fill="#1f2328" font-weight="600">B · Marketing “Sign in”</text>
  <text x="730" y="240" font-size="10" fill="#57606a">/ledger?utm_… → Sign up</text>
  <rect x="870" y="210" width="118" height="46" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/>
  <text x="878" y="228" font-size="11" fill="#1f2328" font-weight="600">Sign in</text>
  <text x="878" y="244" font-size="10" fill="#57606a">next=/ledger</text>
  <rect x="1010" y="210" width="118" height="46" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/>
  <text x="1018" y="228" font-size="11" fill="#1f2328" font-weight="600">Sign up + code</text>
  <text x="1018" y="244" font-size="10" fill="#57606a">next kept</text>
  <line x1="988" y1="233.0" x2="1007" y2="233.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1150" y="210" width="118" height="46" rx="6" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1"/>
  <text x="1158" y="228" font-size="11" fill="#1f2328" font-weight="600">/ledger</text>
  <text x="1158" y="244" font-size="10" fill="#57606a">0 ledgers → redirect</text>
  <line x1="1128" y1="233.0" x2="1147" y2="233.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1290" y="210" width="118" height="46" rx="6" fill="#eefbf1" stroke="#2f8f4e" stroke-width="1"/>
  <text x="1298" y="228" font-size="11" fill="#1f2328" font-weight="600">Welcome</text>
  <text x="1298" y="244" font-size="10" fill="#57606a">?next=/ledger</text>
  <line x1="1268" y1="233.0" x2="1287" y2="233.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
