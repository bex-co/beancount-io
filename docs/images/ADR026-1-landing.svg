  <text x="1138" y="443" font-size="10" fill="#1f2328">no ledgers → Welcome</text>
  <path d="M1086,413 C1106,413 1110,439 1127,439" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="30" y="500" width="680" height="116" rx="6" fill="#fff0f0" stroke="#cf222e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="44" y="522" font-size="13" fill="#cf222e" font-weight="600">Problems</text>
  <text x="44" y="544" font-size="11" fill="#57606a">• A visitor from the marketing site's sign-in link who signs up lands on an empty ledger list (B).</text>
  <text x="44" y="561" font-size="11" fill="#57606a">• /ledger does not redirect a user with no ledgers; register-otp.tsx lets next win over welcome.</text>
  <text x="44" y="578" font-size="11" fill="#57606a">• Sign-in (D) follows next to the same empty list when the account has no ledgers.</text>
  <rect x="730" y="500" width="680" height="116" rx="6" fill="#eefbf1" stroke="#2f8f4e" stroke-width="1"/>
  <text x="744" y="522" font-size="13" fill="#2f8f4e" font-weight="600">Change (decided in ADR026, not built)</text>
  <text x="744" y="544" font-size="11" fill="#57606a">• The /ledger list sends a signed-in user with no ledgers to /auth/welcome, keeping next.</text>
  <text x="744" y="561" font-size="11" fill="#57606a">• Welcome creates the ledger, then follows next when it points inside the ledger app.</text>
  <text x="744" y="578" font-size="11" fill="#57606a">• One rule fixes every entry: sign-up, sign-in, bookmarks, and the marketing links.</text>
</svg>
