<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 870" width="1280" height="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <title>ADR026 wireframe: mobile app</title>
  <rect width="1280" height="870" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="600">Mobile app — ADR026 wireframes</text>
  <text x="30" y="56" fill="#57606a" font-size="12">Device: language de-DE, regionCode DE, currencyCode EUR · Blue = inferred with its source · Green = saved to the account</text>

  <!-- Phone 1: Details -->
  <g transform="translate(70,90)">
    <text x="0" y="0" font-size="14" font-weight="600">1 · Create · Details (last step)</text>
    <rect x="0" y="14" width="300" height="620" rx="36" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
    <rect x="110" y="26" width="80" height="18" rx="9" fill="#1f2328"/>
    <text x="30" y="70" font-size="12" font-weight="600">9:41</text>
    <text x="20" y="104" fill="#3b6fd8">‹ Purpose</text>
    <text x="150" y="104" text-anchor="middle" font-weight="600">Details</text>
    <text x="280" y="104" text-anchor="end" fill="#57606a" font-size="12">2 of 2</text>
    <line x1="0" y1="116" x2="300" y2="116" stroke="#eaeef2"/>

    <text x="20" y="142" fill="#57606a" font-size="12">TITLE</text>
    <rect x="20" y="150" width="260" height="38" rx="8" fill="#f6f8fa"/>
    <text x="32" y="174">Household books</text>

    <text x="20" y="214" fill="#57606a" font-size="12">CURRENCY</text>
    <rect x="20" y="222" width="260" height="60" rx="8" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="32" y="246" font-weight="600">EUR — Euro</text>
    <text x="268" y="246" text-anchor="end" fill="#3b6fd8" font-weight="600">Change</text>
    <text x="32" y="270" fill="#3b6fd8" font-size="11">From your device settings</text>

    <text x="20" y="310" fill="#57606a" font-size="12">FIRST ACCOUNT · OPTIONAL</text>
    <rect x="20" y="318" width="260" height="74" rx="8" fill="#f6f8fa"/>
    <text x="32" y="342">Girokonto</text><text x="268" y="342" text-anchor="end" font-weight="600">1.250,00 €</text>
    <line x1="32" y1="354" x2="268" y2="354" stroke="#d0d7de"/>
    <text x="32" y="378" fill="#57606a" font-size="12">Balance from</text><text x="268" y="378" text-anchor="end" font-size="12">Today ›</text>
    <text x="20" y="414" fill="#3b6fd8" font-size="12">+ Add account</text>
    <text x="280" y="414" text-anchor="end" fill="#3b6fd8" font-size="12">Set up later</text>

    <rect x="2" y="500" width="296" height="112" fill="#f6f8fa"/>
    <line x1="2" y1="500" x2="298" y2="500" stroke="#d0d7de"/>
    <text x="20" y="524" font-size="12" font-weight="600">Will create</text>
    <text x="20" y="544" font-size="12">🔒 Private · EUR · 12 accounts</text>
    <text x="280" y="544" text-anchor="end" fill="#3b6fd8" font-size="12">Preview ›</text>
    <rect x="20" y="560" width="260" height="46" rx="12" fill="#1f2328"/>
    <text x="150" y="589" text-anchor="middle" fill="#ffffff" font-weight="600">Create ledger</text>
    <circle cx="290" cy="232" r="10" fill="#bf8700"/><text x="290" y="236" fill="#fff" font-weight="700" text-anchor="middle" font-size="12">A</text>
    <circle cx="290" cy="514" r="10" fill="#bf8700"/><text x="290" y="518" fill="#fff" font-weight="700" text-anchor="middle" font-size="12">B</text>
  </g>

  <!-- Phone 2: After creation -->
  <g transform="translate(490,90)">
    <text x="0" y="0" font-size="14" font-weight="600">2 · Right after creation</text>
    <rect x="0" y="14" width="300" height="620" rx="36" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
    <rect x="110" y="26" width="80" height="18" rx="9" fill="#1f2328"/>
    <text x="30" y="70" font-size="12" font-weight="600">9:41</text>
    <text x="20" y="108" font-size="22" font-weight="700">Household books</text>

    <rect x="20" y="124" width="260" height="62" rx="10" fill="#eefaf1" stroke="#2f8f4e"/>
    <text x="34" y="148" fill="#2f8f4e" font-weight="600" font-size="12">✓ Created</text>
    <text x="34" y="170" font-size="12">Private · EUR · 12 accounts</text>
    <text x="266" y="170" text-anchor="end" fill="#3b6fd8" font-size="12">Change ›</text>
    <text x="20" y="204" fill="#2f8f4e" font-size="11">✓ EUR saved as your default (none was set)</text>

    <text x="20" y="244" fill="#57606a" font-size="12">NEXT STEP</text>
    <rect x="20" y="252" width="260" height="46" rx="12" fill="#1f2328"/>
    <text x="150" y="281" text-anchor="middle" fill="#ffffff" font-weight="600">Record a purchase</text>
    <rect x="20" y="310" width="260" height="96" rx="10" fill="#f6f8fa"/>
    <text x="34" y="340">Import records</text><text x="266" y="340" text-anchor="end" fill="#57606a">›</text>
    <line x1="34" y1="358" x2="266" y2="358" stroke="#d0d7de"/>
    <text x="34" y="386">Verify a starting balance</text><text x="266" y="386" text-anchor="end" fill="#57606a">›</text>
    <circle cx="290" cy="134" r="10" fill="#bf8700"/><text x="290" y="138" fill="#fff" font-weight="700" text-anchor="middle" font-size="12">C</text>
  </g>

  <!-- Phone 3: Settings -->
  <g transform="translate(910,90)">
    <text x="0" y="0" font-size="14" font-weight="600">3 · Settings</text>
    <rect x="0" y="14" width="300" height="620" rx="36" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
    <rect x="110" y="26" width="80" height="18" rx="9" fill="#1f2328"/>
    <text x="30" y="70" font-size="12" font-weight="600">9:41</text>
    <text x="20" y="108" font-size="22" font-weight="700">Settings</text>

    <text x="20" y="146" fill="#57606a" font-size="12">PREFERENCES</text>
    <rect x="20" y="154" width="260" height="104" rx="10" fill="#f6f8fa"/>
    <text x="34" y="184">Language</text><text x="266" y="184" text-anchor="end" fill="#57606a">Deutsch ›</text>
    <line x1="34" y1="204" x2="266" y2="204" stroke="#d0d7de"/>
    <text x="34" y="232">Default currency</text><text x="266" y="232" text-anchor="end" fill="#57606a">EUR ›</text>
    <text x="20" y="278" fill="#2f8f4e" font-size="11">✓ Both saved to your account — also used on the web</text>
    <text x="20" y="296" fill="#57606a" font-size="11">Default currency only pre-fills new ledgers.</text>

    <text x="20" y="336" fill="#57606a" font-size="12">ACCOUNT</text>
    <rect x="20" y="344" width="260" height="104" rx="10" fill="#f6f8fa"/>
    <text x="34" y="374">Profile</text><text x="266" y="374" text-anchor="end" fill="#57606a">›</text>
    <line x1="34" y1="394" x2="266" y2="394" stroke="#d0d7de"/>
    <text x="34" y="422">Sign out</text>
    <circle cx="290" cy="164" r="10" fill="#bf8700"/><text x="290" y="168" fill="#fff" font-weight="700" text-anchor="middle" font-size="12">D</text>
  </g>

  <!-- Notes -->
  <rect x="70" y="744" width="1140" height="104" rx="8" fill="#fff8e6" stroke="#bf8700"/>
  <g font-size="12">
    <text x="86" y="766"><tspan font-weight="700" fill="#bf8700">A</tspan>  No saved preference, so the device currencyCode (EUR) is the native hint; it is preselected and labelled. "Change" opens a searchable list with localized names.</text>
    <text x="86" y="786"><tspan font-weight="700" fill="#bf8700">B</tspan>  A sticky summary replaces the review page: visibility, currency, account count, and a preview beside Create ledger. Two steps; accepting defaults is two taps.</text>
    <text x="86" y="806"><tspan font-weight="700" fill="#bf8700">C</tspan>  Choices stay changeable after creation. Accepted unchanged, EUR seeds defaultCurrency only because none was stored. Amounts display in de-DE format.</text>
    <text x="86" y="826"><tspan font-weight="700" fill="#bf8700">D</tspan>  Language and default currency write through GraphQL updateProfile; registration already sent the resolved language (de) instead of "en".</text>
    <text x="86" y="843" fill="#57606a" font-size="11">Mobile does not ship ja or ko yet (ADR026 open question 3); such devices resolve to English.</text>
  </g>
</svg>
