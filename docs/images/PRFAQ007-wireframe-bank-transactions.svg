  <rect x="930" y="692" width="200" height="22" rx="11" fill="#f6f8fa" stroke="#8c959f"/><text x="1030" y="708" text-anchor="middle" font-size="12">history · 6 priors</text><text x="1218" y="708" text-anchor="end" fill="#57606a">Undo</text>
