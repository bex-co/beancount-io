  <rect x="930" y="654" width="200" height="22" rx="11" fill="#eefbf1" stroke="#2f8f4e"/><text x="1030" y="670" text-anchor="middle" fill="#2f8f4e" font-size="12">matched an EDI file</text><text x="1218" y="670" text-anchor="end" fill="#57606a">Undo</text>
  <line x1="62" y1="682" x2="1218" y2="682" stroke="#d0d7de"/>
