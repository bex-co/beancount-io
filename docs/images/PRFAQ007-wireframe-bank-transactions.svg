<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <title>PRFAQ007 wireframe: bank transactions with customer payments</title>
  <desc>The bank transactions review page. Deposits are categorized to Assets:AccountsReceivable split by invoice, next to an ordinary expense row. Two deposits need a decision: a lockbox batch with one short payment, and a wire with no remittance where two open invoices fit.</desc>
  <rect width="1280" height="760" fill="#ffffff"/>
  <rect x="20" y="20" width="1240" height="720" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="44" y="58" font-size="18" font-weight="600">Bank transactions</text>
  <rect x="1126" y="38" width="110" height="32" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="1181" y="59" text-anchor="middle">Sync now</text>

  <rect x="44" y="84" width="1192" height="40" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="62" y="109">Since yesterday: <tspan font-weight="600">9 imported</tspan> automatically · <tspan font-weight="600">1 lockbox deposit</tspan> applied to 22 invoices · <tspan font-weight="600">2 need a decision</tspan> · <tspan font-weight="600">3 to categorize</tspan></text>

  <!-- Needs a decision -->
  <text x="44" y="152" font-size="15" font-weight="600">Needs a decision (2)</text>
  <rect x="44" y="164" width="590" height="132" rx="6" fill="#ffffff" stroke="#bf8700"/>
  <text x="62" y="190" font-weight="600">Nov 20 · LOCKBOX DEPOSIT · +41,280.00 USD</text>
  <text x="62" y="212" fill="#9a6700">13 of 14 payments in this batch are applied. One is short.</text>
  <rect x="62" y="224" width="554" height="28" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="74" y="243">Acme Corp · check 10482 · 1,960.00 → INV-101, INV-102 · short by 40.00</text>
  <rect x="62" y="260" width="140" height="26" rx="6" fill="#ffffff" stroke="#1f2328"/>
  <text x="132" y="278" text-anchor="middle" font-weight="600">Review payment</text>

  <rect x="646" y="164" width="590" height="132" rx="6" fill="#ffffff" stroke="#bf8700"/>
  <text x="664" y="190" font-weight="600">Nov 21 · WIRE IN NORTHWIND · +725.00 USD</text>
  <text x="664" y="212" fill="#9a6700">No remittance arrived. Two open invoices could be this payment.</text>
  <rect x="664" y="224" width="270" height="28" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="676" y="243">○ INV-110 · 725.00 · due Nov 15</text>
  <rect x="946" y="224" width="270" height="28" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="958" y="243">○ INV-114 · 725.00 · due Dec 1</text>
  <rect x="664" y="260" width="140" height="26" rx="6" fill="#ffffff" stroke="#1f2328"/>
  <text x="734" y="278" text-anchor="middle" font-weight="600">Apply to selected</text>
  <rect x="814" y="260" width="130" height="26" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="879" y="278" text-anchor="middle">Leave unapplied</text>

  <!-- To categorize -->
  <text x="44" y="330" font-size="15" font-weight="600">To categorize (3)</text>
  <rect x="1126" y="310" width="110" height="28" rx="6" fill="#1f2328"/>
  <text x="1181" y="329" text-anchor="middle" fill="#ffffff" font-weight="600">Submit (3)</text>
  <rect x="44" y="346" width="1192" height="214" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <g font-size="11" font-weight="600" fill="#57606a">
    <text x="62" y="370">DATE</text><text x="124" y="370">FROM THE BANK</text><text x="370" y="370">PAYEE</text><text x="530" y="370">NARRATION</text><text x="800" y="370" text-anchor="end">AMOUNT</text><text x="820" y="370">CATEGORY</text><text x="1090" y="370">SOURCE</text>
  </g>
  <line x1="62" y1="380" x2="1218" y2="380" stroke="#8c959f"/>

