  <rect x="1090" y="396" width="128" height="22" rx="11" fill="#f6f8fa" stroke="#8c959f"/><text x="1154" y="412" text-anchor="middle" font-size="12">EDI file</text>
  <line x1="62" y1="442" x2="1218" y2="442" stroke="#d0d7de"/>

  <text x="62" y="472">Nov 21</text><text x="124" y="472" fill="#57606a" font-size="12">DEPOSIT CHECK 7731</text>
  <rect x="370" y="454" width="148" height="28" rx="5" fill="#ffffff" stroke="#8c959f"/><text x="380" y="473">Cedar Supply</text>
  <rect x="530" y="454" width="180" height="28" rx="5" fill="#ffffff" stroke="#8c959f"/><text x="540" y="473">Payment INV-103</text>
  <text x="800" y="473" text-anchor="end">+500.00</text>
  <rect x="820" y="450" width="256" height="44" rx="5" fill="#eefbf1" stroke="#2f8f4e"/>
  <text x="830" y="468" font-weight="600">Assets:AccountsReceivable</text><text x="830" y="486" font-size="12" fill="#2f8f4e">INV-103 · paid in full ▾</text>
  <rect x="1090" y="458" width="128" height="22" rx="11" fill="#f6f8fa" stroke="#8c959f"/><text x="1154" y="474" text-anchor="middle" font-size="12">lockbox image</text>
  <line x1="62" y1="504" x2="1218" y2="504" stroke="#d0d7de"/>

  <text x="62" y="534">Nov 21</text><text x="124" y="534" fill="#57606a" font-size="12">HARDWARE DEPOT 114 OAK</text>
  <rect x="370" y="516" width="148" height="28" rx="5" fill="#ffffff" stroke="#8c959f"/><text x="380" y="535">Hardware Depot</text>
