  <rect x="820" y="516" width="256" height="28" rx="5" fill="#ffffff" stroke="#8c959f"/><text x="830" y="535">Expenses:Supplies</text>
  <rect x="1090" y="520" width="128" height="22" rx="11" fill="#f6f8fa" stroke="#8c959f"/><text x="1154" y="536" text-anchor="middle" font-size="12">history · 4 prior</text>

  <!-- Imported automatically -->
  <text x="44" y="592" font-size="15" font-weight="600">Imported automatically (9)</text>
  <rect x="44" y="604" width="1192" height="118" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="62" y="632">Nov 19 · LOCKBOX DEPOSIT · +28,900.00 → Assets:AccountsReceivable · 9 payments, 22 invoices</text>
  <rect x="930" y="616" width="200" height="22" rx="11" fill="#eefbf1" stroke="#2f8f4e"/><text x="1030" y="632" text-anchor="middle" fill="#2f8f4e" font-size="12">matched a lockbox batch</text><text x="1218" y="632" text-anchor="end" fill="#57606a">Undo</text>
