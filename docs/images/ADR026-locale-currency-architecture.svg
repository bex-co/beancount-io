<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
  <title>ADR026: how signals, clients, and backend-v2 decide language and currency</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8f4e"/>
    </marker>
  </defs>

  <rect width="1280" height="820" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="600">ADR026 — locale, language, and currency defaults</text>
  <text x="30" y="58" fill="#57606a">Infer to suggest, never to decide: clients read signals locally and send only chosen values; servers never infer.</text>

  <!-- Column headers -->
  <text x="30" y="88" font-size="13" font-weight="600" fill="#57606a">SIGNALS · read on the device, never sent raw</text>
  <text x="360" y="88" font-size="13" font-weight="600" fill="#3b6fd8">CLIENTS · resolve and label suggestions</text>
  <text x="840" y="88" font-size="13" font-weight="600" fill="#2f8f4e">BACKEND-V2 · stores choices, never infers</text>

  <!-- Signals -->
  <g>
    <rect x="30" y="100" width="260" height="160" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="46" y="124" font-size="13" font-weight="600">Browser</text>
    <text x="46" y="148">?lang= · i18nextLng cookie</text>
    <text x="46" y="170">Accept-Language</text>
    <text x="46" y="192">Region subtag (de-DE, en-US)</text>
    <text x="46" y="214">IANA time zone (Europe/Berlin)</text>
    <text x="46" y="240" fill="#57606a" font-style="italic">time zone: conflict check only</text>

    <rect x="30" y="290" width="260" height="110" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="46" y="314" font-size="13" font-weight="600">Device (expo-localization)</text>
    <text x="46" y="338">Preferred languages</text>
    <text x="46" y="360">regionCode · currencyCode</text>
    <text x="46" y="384" fill="#57606a" font-style="italic">currencyCode, regionCode: new</text>

    <rect x="30" y="430" width="260" height="100" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="46" y="454" font-size="13" font-weight="600">Terminal</text>
    <text x="46" y="478">LC_ALL › LC_MONETARY › LANG</text>
    <text x="46" y="502" fill="#57606a" font-style="italic">interactive bea init only</text>
  </g>

  <!-- Clients -->
  <g>
    <rect x="360" y="100" width="400" height="200" rx="8" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="376" y="124" font-size="14" font-weight="600">Web dashboard</text>
    <text x="376" y="148" font-weight="600">Language</text>
    <text x="376" y="166">?lang › cookie › profile locale › Accept-Language (new) › en</text>
    <text x="376" y="190" font-weight="600">Currency suggestion</text>
    <text x="376" y="208">flow › saved › native › browser region › USD</text>
    <text x="376" y="226">+ time-zone currency as a labelled one-tap candidate</text>
    <text x="376" y="250" font-weight="600">Formatting</text>
    <text x="376" y="268">full locale via Intl — display only, never stored</text>
    <text x="376" y="288" fill="#57606a" font-style="italic">writes language/currency to the account on explicit choice</text>

    <rect x="360" y="320" width="400" height="120" rx="8" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="376" y="344" font-size="14" font-weight="600">Mobile app</text>
    <text x="376" y="368">Language: first supported device language</text>
    <text x="376" y="390">Currency: same precedence; device currencyCode is the native hint</text>
    <text x="376" y="412">Sends resolved language at registration</text>
    <text x="376" y="430" fill="#57606a" font-style="italic">writes language/currency to the account on explicit choice</text>

    <rect x="360" y="460" width="400" height="90" rx="8" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="376" y="484" font-size="14" font-weight="600">CLI · bea init (local)</text>
    <text x="376" y="506">Interactive: currency prefilled from POSIX locale region</text>
    <text x="376" y="526">bea --no-input init: --currency still required (exit 2)</text>
    <text x="376" y="543" fill="#57606a" font-style="italic">writes local ledger files; no backend call</text>

    <rect x="360" y="580" width="400" height="56" rx="8" fill="#ffffff" stroke="#3b6fd8" stroke-dasharray="5 4"/>
    <text x="376" y="603" font-weight="600">Region → currency table (ADR021 catalog)</text>
    <text x="376" y="622" fill="#57606a">generated copy per package; single-currency regions only</text>
    <line x1="560" y1="580" x2="560" y2="554" stroke="#3b6fd8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="568" y="571" fill="#3b6fd8" font-size="11">lookup by web, mobile, CLI</text>
  </g>

  <!-- Signals to clients -->
  <line x1="290" y1="180" x2="356" y2="180" stroke="#57606a" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="290" y1="345" x2="356" y2="370" stroke="#57606a" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="290" y1="480" x2="356" y2="500" stroke="#57606a" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="296" y="172" fill="#57606a" font-size="11">read</text>

  <!-- Backend -->
  <g>
    <rect x="840" y="100" width="410" height="460" rx="10" fill="#f3fbf5" stroke="#2f8f4e" stroke-width="1.5"/>

    <rect x="860" y="116" width="370" height="96" rx="8" fill="#ffffff" stroke="#2f8f4e"/>
    <text x="876" y="140" font-size="14" font-weight="600">Account profile</text>
    <text x="876" y="164">users.locale — registered value, not hardcoded "en"</text>
    <text x="876" y="186">users.defaultCurrency — <tspan font-weight="600" fill="#2f8f4e">new</tspan>, nullable, suggestion only</text>
    <text x="876" y="204" fill="#57606a" font-style="italic">first ledger seeds it; corrections overwrite it</text>

    <rect x="860" y="232" width="370" height="96" rx="8" fill="#ffffff" stroke="#2f8f4e"/>
    <text x="876" y="256" font-size="14" font-weight="600">Writes · GraphQL only</text>
    <text x="876" y="280">signUp(locale, defaultLedgerCurrency)</text>
    <text x="876" y="302">updateProfile(locale, defaultCurrency)</text>
    <text x="876" y="320" fill="#57606a" font-style="italic">keeps the documented profile-write exclusion</text>

    <rect x="860" y="348" width="370" height="56" rx="8" fill="#ffffff" stroke="#2f8f4e"/>
    <text x="876" y="372" font-size="14" font-weight="600">Profile read · REST · GraphQL · MCP</text>
    <text x="876" y="392">returns locale and defaultCurrency on all three</text>

    <rect x="860" y="424" width="370" height="120" rx="8" fill="#ffffff" stroke="#2f8f4e"/>
    <text x="876" y="448" font-size="14" font-weight="600">Ledger create · REST · GraphQL · MCP</text>
    <text x="876" y="472">setup.operatingCurrency as sent</text>
    <text x="876" y="494">omitted → documented default (USD)</text>
    <text x="876" y="516" font-weight="600" fill="#cf222e">never reads the saved preference</text>
    <text x="876" y="536" fill="#57606a" font-style="italic">→ hosted ledger files</text>

    <line x1="1045" y1="232" x2="1045" y2="216" stroke="#2f8f4e" marker-end="url(#arrow-green)"/>
    <line x1="1045" y1="348" x2="1045" y2="332" stroke="#2f8f4e" stroke-dasharray="4 3" marker-start="url(#arrow-green)"/>
  </g>

  <!-- Bus: chosen values only -->
  <line x1="760" y1="230" x2="800" y2="230" stroke="#3b6fd8" stroke-width="2"/>
  <line x1="760" y1="380" x2="800" y2="380" stroke="#3b6fd8" stroke-width="2"/>
  <line x1="800" y1="230" x2="800" y2="484" stroke="#3b6fd8" stroke-width="2"/>
  <line x1="800" y1="280" x2="856" y2="280" stroke="#3b6fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="484" x2="856" y2="484" stroke="#3b6fd8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="824" y="384" fill="#3b6fd8" font-size="11" font-weight="600" text-anchor="middle" transform="rotate(-90 824 384)">chosen values only</text>

  <!-- Saved preference back to clients -->
  <line x1="860" y1="140" x2="764" y2="140" stroke="#2f8f4e" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <text x="800" y="116" fill="#2f8f4e" font-size="10" text-anchor="middle">saved locale,</text>
  <text x="800" y="130" fill="#2f8f4e" font-size="10" text-anchor="middle">defaultCurrency</text>

  <!-- Machine callers -->
  <rect x="840" y="590" width="410" height="90" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="856" y="614" font-size="14" font-weight="600">Agents, scripts, bea cloud ledger create</text>
  <text x="856" y="638">Pass every value explicitly; no inference on their behalf</text>
  <text x="856" y="660" fill="#57606a" font-style="italic">may read defaultCurrency from the profile, then send it</text>
  <line x1="1045" y1="590" x2="1045" y2="548" stroke="#bf8700" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1053" y="574" fill="#bf8700" font-size="11">explicit setup</text>

  <!-- Never inferred -->
  <rect x="30" y="704" width="1220" height="86" rx="8" fill="#fff1f0" stroke="#cf222e" stroke-width="1.5"/>
  <text x="46" y="728" font-size="14" font-weight="600" fill="#cf222e">Never inferred — on any product</text>
  <text x="46" y="752">Starter, modules, tax facts, account names (files stay ASCII English; interfaces show translated labels)</text>
  <text x="46" y="774">Currency from language alone, IP address, email domain, or identity-provider profile · inferred language is never written to the cookie or the account</text>
</svg>
