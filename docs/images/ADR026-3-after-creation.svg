<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 660" width="1440" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
  <title>ADR026 section 3: after creation, before and after</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f4e"/></marker>
  </defs>
  <rect width="1440" height="660" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" fill="#1f2328" font-weight="600">ADR026 · 3 — After creation</text>
  <text x="30" y="58" font-size="12" fill="#57606a">The first screen of a new ledger: the step from an empty ledger to a first useful result.</text>
  <rect x="30" y="86" width="680" height="30" rx="6" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
  <text x="44" y="106" font-size="13" fill="#1f2328" font-weight="600">Before — as built on 2026-11-09</text>
  <rect x="730" y="86" width="680" height="30" rx="6" fill="#eefbf1" stroke="#2f8f4e" stroke-width="1"/>
  <text x="744" y="106" font-size="13" fill="#2f8f4e" font-weight="600">After — ADR026 (illustrative, meets the record's requirements)</text>
  <text x="30" y="130" font-size="11" fill="#57606a">Ledger overview, no activity yet</text>
  <rect x="30" y="138" width="680" height="230" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1"/>
  <text x="50" y="170" font-size="15" fill="#1f2328" font-weight="600">Set up your ledger</text>
  <text x="50" y="190" font-size="11" fill="#57606a">Add accounts and entries to see your balances here.</text>
  <rect x="50" y="210" width="640" height="46" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="64" y="230" font-size="12" fill="#1f2328" font-weight="600">☐ Open an account</text>
  <text x="64" y="246" font-size="10" fill="#57606a">a link to Accounts</text>
  <rect x="50" y="266" width="640" height="46" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="64" y="286" font-size="12" fill="#1f2328" font-weight="600">☐ Add your first entry</text>
  <text x="64" y="302" font-size="10" fill="#57606a">a link to Journal</text>
  <text x="50" y="344" font-size="10" fill="#cf222e">Disappears as soon as the ledger has any activity, opening balances included.</text>
  <text x="730" y="130" font-size="11" fill="#2f8f4e">Ledger overview, just created (illustrative)</text>
  <rect x="730" y="138" width="680" height="230" rx="10" fill="#ffffff" stroke="#2f8f4e" stroke-width="1"/>
  <text x="750" y="170" font-size="15" fill="#1f2328" font-weight="600">Your household ledger is ready</text>
  <text x="750" y="190" font-size="11" fill="#57606a">Next: record a purchase and see what money is left.</text>
  <rect x="750" y="206" width="170" height="28" rx="5" fill="#2f8f4e" stroke="#2f8f4e" stroke-width="1"/>
  <text x="835.0" y="224" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Record a transaction</text>
  <rect x="930" y="206" width="140" height="28" rx="5" fill="#ffffff" stroke="#2f8f4e" stroke-width="1"/>
  <text x="1000.0" y="224" font-size="12" fill="#2f8f4e" font-weight="600" text-anchor="middle">Import records</text>
  <rect x="1080" y="206" width="170" height="28" rx="5" fill="#ffffff" stroke="#2f8f4e" stroke-width="1"/>
  <text x="1165.0" y="224" font-size="12" fill="#2f8f4e" font-weight="600" text-anchor="middle">Verify a starting balance</text>
  <rect x="750" y="250" width="640" height="56" rx="6" fill="#fff0f0" stroke="#cf222e" stroke-width="1"/>
  <text x="764" y="270" font-size="11" fill="#cf222e" font-weight="600">Starting balance not verified: Assets:Cash</text>
  <text x="764" y="288" font-size="10" fill="#57606a">Totals that include it stay marked until you confirm a balance or a zero.</text>
  <text x="750" y="330" font-size="11" fill="#3b6fd8">Setup 2 of 3 · stays in the ledger menu after activity appears</text>
  <rect x="30" y="400" width="680" height="210" rx="6" fill="#fff0f0" stroke="#cf222e" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="44" y="424" font-size="13" fill="#cf222e" font-weight="600">What is wrong today</text>
  <text x="44" y="448" font-size="11" fill="#57606a">• Two generic steps, the same for every kind of ledger.</text>
  <text x="44" y="468" font-size="11" fill="#57606a">• No choice between recording, importing, and checking a balance.</text>
  <text x="44" y="488" font-size="11" fill="#57606a">• The card hides on any activity, so a ledger opened with balances</text>
  <text x="54" y="508" font-size="11" fill="#57606a">never shows it, and unfinished setup becomes unreachable.</text>
  <text x="44" y="528" font-size="11" fill="#57606a">• An unknown starting balance looks the same as a verified one.</text>
  <rect x="730" y="400" width="680" height="210" rx="6" fill="#eefbf1" stroke="#2f8f4e" stroke-width="1"/>
  <text x="744" y="424" font-size="13" fill="#2f8f4e" font-weight="600">ADR026 decisions (not built)</text>
  <text x="744" y="448" font-size="11" fill="#57606a">• One recommended next action, with the other two visible:</text>
  <text x="754" y="468" font-size="11" fill="#57606a">Record a transaction · Import records · Verify a starting balance.</text>
  <text x="744" y="488" font-size="11" fill="#57606a">• The recommendation follows the starter's first useful result.</text>
  <text x="744" y="508" font-size="11" fill="#57606a">• Unfinished setup stays reachable after activity appears.</text>
  <text x="744" y="528" font-size="11" fill="#57606a">• Unknown balances stay visibly unverified (bcio_opening_balance_status).</text>
  <text x="744" y="548" font-size="11" fill="#57606a">• Onboarding ends at a first useful result, not at a created file.</text>
</svg>
