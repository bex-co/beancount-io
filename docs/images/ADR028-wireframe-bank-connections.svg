<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
  <title>ADR028 wireframe: bank connections</title>
  <desc>Wireframe of the bank connections page. A banner asks the owner to reconnect one bank. Each bank card lists its accounts with a ledger account, a currency, and one import choice of four: don’t import, import for review, import what I’ve booked before, or import everything with AI categorizing the rest. A suggested ledger account that does not exist yet can be created on acceptance. A second login at the same bank and another bank appear as their own cards.</desc>
  <rect width="1280" height="820" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="600">ADR028 wireframe — Bank connections</text>
  <text x="30" y="58" fill="#57606a">Journeys J1, J2, J3, J9 and J10. Grey is the page; green notes name what is new and its decision.</text>

  <!-- Page frame -->
  <rect x="30" y="80" width="900" height="710" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="50" y="110" font-size="16" font-weight="600">Banks</text>
  <rect x="770" y="92" width="140" height="28" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="840" y="110" text-anchor="middle" font-weight="600">+ Connect a bank</text>

  <!-- Banner -->
  <rect x="50" y="132" width="860" height="40" rx="6" fill="#fff8e5" stroke="#bf8700"/>
  <text x="66" y="157">First Bank (business) needs you to sign in again. Nothing is imported from it until you do.</text>
  <rect x="800" y="140" width="96" height="24" rx="6" fill="#ffffff" stroke="#bf8700"/>
  <text x="848" y="156" text-anchor="middle" font-weight="600">Reconnect</text>

  <!-- Bank card 1 -->
  <rect x="50" y="186" width="860" height="290" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="66" y="212" font-size="14" font-weight="600">First Bank · personal login</text>
  <text x="66" y="230" fill="#57606a">Synced 4 minutes ago · 3 accounts shared</text>
  <rect x="560" y="198" width="110" height="24" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="615" y="214" text-anchor="middle">Manage accounts</text>
  <rect x="680" y="198" width="100" height="24" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="730" y="214" text-anchor="middle">Accept all (2)</text>
  <rect x="790" y="198" width="104" height="24" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="842" y="214" text-anchor="middle">Disconnect</text>

  <g fill="#57606a" font-size="11" font-weight="600">
    <text x="66" y="258">BANK ACCOUNT</text>
    <text x="270" y="258">LEDGER ACCOUNT</text>
    <text x="536" y="258">CURRENCY</text>
    <text x="606" y="258">IMPORT</text>
  </g>
  <line x1="66" y1="266" x2="894" y2="266" stroke="#d0d7de"/>

  <!-- Row 1: confirmed -->
  <text x="66" y="292" font-weight="600">Checking ••4821</text>
  <text x="66" y="308" fill="#57606a" font-size="11">depository · checking</text>
  <rect x="270" y="278" width="250" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="282" y="296">Assets:FirstBank:Checking</text>
  <text x="506" y="296" text-anchor="end" fill="#57606a">▾</text>
  <rect x="536" y="278" width="56" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="564" y="296" text-anchor="middle">USD</text>
  <rect x="606" y="278" width="288" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="618" y="296" fill="#1f2328">Import what I’ve booked before</text>
  <text x="880" y="296" text-anchor="end" fill="#57606a">▾</text>
  <line x1="66" y1="320" x2="894" y2="320" stroke="#d0d7de"/>

  <!-- Row 2: suggestion, account to be created -->
  <text x="66" y="346" font-weight="600">Savings ••9930</text>
  <text x="66" y="362" fill="#57606a" font-size="11">depository · savings</text>
  <rect x="270" y="332" width="250" height="28" rx="6" fill="#eefbf1" stroke="#2f8f4e"/>
  <text x="282" y="350">Assets:FirstBank:Savings</text>
  <text x="506" y="350" text-anchor="end" fill="#2f8f4e" font-size="11">new</text>
  <text x="270" y="374" fill="#57606a" font-size="11">Suggested. Accepting opens it.</text>
  <rect x="536" y="332" width="56" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="564" y="350" text-anchor="middle">USD</text>
  <rect x="606" y="332" width="288" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="618" y="350" fill="#1f2328">Import for review</text>
  <text x="880" y="350" text-anchor="end" fill="#57606a">▾</text>
  <text x="606" y="374" fill="#57606a" font-size="11">Automatic options need an accepted account</text>
  <rect x="472" y="364" width="48" height="20" rx="6" fill="#ffffff" stroke="#2f8f4e"/>
  <text x="496" y="378" text-anchor="middle" font-size="11" fill="#2f8f4e">Accept</text>
  <line x1="66" y1="392" x2="894" y2="392" stroke="#d0d7de"/>

  <!-- Row 3: sync off -->
  <text x="66" y="418" font-weight="600" fill="#8c959f">Kids' savings ••1107</text>
  <text x="66" y="434" fill="#8c959f" font-size="11">depository · savings</text>
  <rect x="270" y="404" width="250" height="28" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="282" y="422" fill="#8c959f">Not imported</text>
  <rect x="606" y="404" width="288" height="28" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="618" y="422" fill="#8c959f">Don’t import</text>
  <text x="880" y="422" text-anchor="end" fill="#57606a">▾</text>
  <text x="66" y="460" fill="#57606a" font-size="11">Don’t import: nothing further is fetched for this account. What is already in the ledger stays.</text>

  <!-- Bank card 2: second login, needs reauth -->
  <rect x="50" y="490" width="860" height="120" rx="8" fill="#ffffff" stroke="#bf8700"/>
  <text x="66" y="516" font-size="14" font-weight="600">First Bank · business login</text>
  <rect x="270" y="502" width="120" height="20" rx="10" fill="#fff8e5" stroke="#bf8700"/>
  <text x="330" y="516" text-anchor="middle" font-size="11" fill="#9a6700">Sign-in needed</text>
  <text x="66" y="536" fill="#57606a">Last synced 3 days ago · 1 account shared</text>
  <rect x="790" y="502" width="104" height="24" rx="6" fill="#ffffff" stroke="#bf8700"/>
  <text x="842" y="518" text-anchor="middle" font-weight="600">Reconnect</text>
  <text x="66" y="572" font-weight="600">Business checking ••2204</text>
  <rect x="270" y="556" width="250" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="282" y="574">Assets:FirstBank:Business</text>
  <rect x="536" y="556" width="56" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="564" y="574" text-anchor="middle">USD</text>
  <rect x="606" y="556" width="288" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="618" y="574" fill="#1f2328">Import everything, AI categorizes the rest</text>
  <text x="880" y="574" text-anchor="end" fill="#57606a">▾</text>
  <text x="606" y="600" fill="#9a6700" font-size="11">Paused until you sign in</text>

  <!-- Bank card 3: another bank, card account -->
  <rect x="50" y="624" width="860" height="100" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="66" y="650" font-size="14" font-weight="600">Harbor Card</text>
  <text x="66" y="668" fill="#57606a">Synced 1 hour ago · 1 account shared</text>
  <text x="66" y="700" font-weight="600">Rewards card ••7715</text>
  <rect x="270" y="684" width="250" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="282" y="702">Liabilities:HarborCard</text>
  <rect x="536" y="684" width="56" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="564" y="702" text-anchor="middle">USD</text>
  <rect x="606" y="684" width="288" height="28" rx="6" fill="#ffffff" stroke="#8c959f"/>
  <text x="618" y="702" fill="#1f2328">Import what I’ve booked before</text>
  <text x="880" y="702" text-anchor="end" fill="#57606a">▾</text>

  <!-- Refusal toast -->
  <rect x="50" y="738" width="860" height="40" rx="6" fill="#ffffff" stroke="#8c959f" stroke-dasharray="4 3"/>
  <text x="66" y="763">Shown when a link repeats an account: “Checking ••4821 is already connected through First Bank · personal login.”</text>

  <!-- Notes -->
  <g>
    <rect x="950" y="132" width="300" height="76" rx="8" fill="#eefbf1" stroke="#2f8f4e" stroke-width="1.5"/>
    <text x="966" y="154" font-weight="600">Banner and email · D8 · J9</text>
    <text x="966" y="174">One email and this banner when a bank</text>
    <text x="966" y="194">needs a sign-in or has new accounts.</text>

    <rect x="950" y="222" width="300" height="96" rx="8" fill="#eefbf1" stroke="#2f8f4e" stroke-width="1.5"/>
    <text x="966" y="244" font-weight="600">Confirmed mappings · D9 · J1</text>
    <text x="966" y="264">A suggestion is saved only when the</text>
    <text x="966" y="284">owner accepts it. Two bank accounts</text>
    <text x="966" y="304">cannot share a ledger account (D11).</text>

    <rect x="950" y="332" width="300" height="96" rx="8" fill="#eefbf1" stroke="#2f8f4e" stroke-width="1.5"/>
    <text x="966" y="354" font-weight="600">Create while mapping · D12 · J1</text>
    <text x="966" y="374">A suggested account the ledger lacks is</text>
    <text x="966" y="394">opened when accepted: one open</text>
    <text x="966" y="414">directive, in its own commit.</text>

    <rect x="950" y="442" width="300" height="206" rx="8" fill="#eefbf1" stroke="#2f8f4e" stroke-width="1.5"/>
    <text x="966" y="464" font-weight="600">One import choice · D5, D12 · J1, J3, J4</text>
    <text x="966" y="486" font-weight="600">Don’t import</text>
    <text x="966" y="501" fill="#57606a">Fetches nothing for this account.</text>
    <text x="966" y="521" font-weight="600">Import for review</text>
    <text x="966" y="536" fill="#57606a">Everything waits for you to confirm.</text>
    <text x="966" y="556" font-weight="600">Import what I’ve booked before</text>
    <text x="966" y="571" fill="#57606a">Known merchants, and matches to a receipt</text>
    <text x="966" y="586" fill="#57606a">or a transfer, are booked. The rest waits.</text>
    <text x="966" y="606" font-weight="600">Import everything, AI categorizes the rest</text>
    <text x="966" y="621" fill="#57606a">What is not recognized is booked by AI,</text>
    <text x="966" y="636" fill="#57606a">flagged ! until you confirm it. Uses quota.</text>

    <rect x="950" y="662" width="300" height="116" rx="8" fill="#eefbf1" stroke="#2f8f4e" stroke-width="1.5"/>
    <text x="966" y="684" font-weight="600">Second login, same bank · D1 · J2</text>
    <text x="966" y="704">Accepted as its own card when its</text>
    <text x="966" y="724">accounts are new. A repeated account is</text>
    <text x="966" y="744">refused by name, and nothing is left at</text>
    <text x="966" y="764">Plaid (D2).</text>
  </g>
</svg>
