name: CI

# Per-package CI. Each package has its own path-filtered job so an unrelated
# change does not run another package's checks. Add a new job (or workflow) per
# package as `cli/` and `skills/` gain real code.

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ci.yml"

jobs:
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: mobile/yarn.lock
      - run: yarn install
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:unit
