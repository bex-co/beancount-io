name: CI

# Per-package CI. Each package has its own path-filtered job so an unrelated
# change does not run another package's checks. Add a new job (or workflow) per
# package as `cli/` and `skills/` gain real code.

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22: a transitive dep (listr2@10.2.x) requires >=22.13.0 to install.
          # Satisfies mobile/package.json engines (>=20.19.4).
          node-version: 22
          cache: yarn
          cache-dependency-path: mobile/yarn.lock
      - run: yarn install
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:unit
