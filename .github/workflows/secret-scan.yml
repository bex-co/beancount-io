name: Secret scan

# Whole-tree secret scan on every push to main and every pull request.
# Deliberately NOT path-filtered: a leaked credential anywhere must fail CI,
# and package migrations arrive as large snapshot commits that touch new paths.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks dir . --redact --verbose --exit-code 1
      # The local pre-push scan (scripts/scan-secrets.py) must keep catching what this
      # job catches and skipping what git ignores; the downloaded binary goes on PATH so
      # the end-to-end cases run here instead of being skipped.
      - name: Test the local secret-scan script
        run: PATH="$PWD:$PATH" python3 scripts/test_scan_secrets.py
