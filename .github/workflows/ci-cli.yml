name: CI (cli)

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "fava-slim/**"
      - ".github/workflows/ci-cli.yml"
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "fava-slim/**"
      - ".github/workflows/ci-cli.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fava-slim:
    name: fava-slim
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fava-slim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: fava-slim/uv.lock
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run all checks
        run: make check-all

  cli:
    name: cli
    runs-on: ubuntu-latest
    needs: fava-slim
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run all checks
        run: make check-all
