name: CI (skills)

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".agents/**"
      - ".claude/skills"
      - ".github/workflows/ci-skills.yml"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - ".agents/**"
      - ".claude/skills"
      - ".github/workflows/ci-skills.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  skills:
    name: skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - name: Sync CLI (customer bea + upstream oracle)
        working-directory: cli
        run: uv sync --all-groups
      - name: Run skills checks
        # Customer leg: bea check with bean-* scrubbed from PATH.
        # Oracle leg: uv run --project cli bean-check (locked upstream).
        run: python3 skills/scripts/ci-check.py
      - name: Run ci-check unit tests
        run: python3 skills/scripts/test_ci_check.py
      - name: Run development QA helper tests
        run: node --test .agents/skills/qa-shared/scripts/qa-login.test.mjs
