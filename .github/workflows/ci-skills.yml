name: CI (skills)

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/skills/**"
      - "docs/skills/**"
      - ".agents/**"
      - ".claude/skills"
      - ".claude-plugin/**"
      - "plugin.json"
      - "skills.sh.json"
      - ".agents/plugins/**"
      - ".github/workflows/ci-skills.yml"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/skills/**"
      - "docs/skills/**"
      - ".agents/**"
      - ".claude/skills"
      - ".claude-plugin/**"
      - "plugin.json"
      - "skills.sh.json"
      - ".agents/plugins/**"
      - ".github/workflows/ci-skills.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  skills:
    name: skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - name: Sync CLI (customer bea + upstream oracle)
        working-directory: cli
        run: uv sync --all-groups
      - name: Run skills checks
        # Customer leg: bea check with bean-* scrubbed from PATH.
        # Oracle leg: uv run --project cli bean-check (locked upstream).
        run: python3 scripts/skills/ci-check.py
      - name: Run ci-check unit tests
        run: python3 scripts/skills/test_ci_check.py
      - name: Run customer-suite installer and first-query tests
        run: python3 scripts/skills/test_beancount_skills.py
      - name: Run bea recipe tests against the published minimum bea
        # The step above runs the checkout's bea; customers run a release.
        # Install the minimum bea-cli.md declares and run the recipes on it.
        run: |
          minimum="$(python3 scripts/skills/ci-check.py --print-bea-minimum)"
          uv venv "$RUNNER_TEMP/published-bea"
          uv pip install --python "$RUNNER_TEMP/published-bea/bin/python" "beancount-io==$minimum"
          "$RUNNER_TEMP/published-bea/bin/bea" --version
          cd scripts/skills
          PATH="$RUNNER_TEMP/published-bea/bin:$PATH" SKILLS_BEA=published python3 -m unittest -v test_beancount_skills.TestBeaRecipes
      - name: Run development QA helper tests
        run: node --test .agents/skills/qa-shared/scripts/qa-login.test.mjs .agents/skills/qa-shared/scripts/qa-mcp.test.mjs
