name: CI (skills)

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/skills/**"
      - "docs/skills/**"
      - ".agents/**"
      - ".claude/skills"
      - ".claude-plugin/**"
      - "plugin.json"
      - "skills.sh.json"
      - ".agents/plugins/**"
      - ".github/workflows/ci-skills.yml"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/skills/**"
      - "docs/skills/**"
      - ".agents/**"
      - ".claude/skills"
      - ".claude-plugin/**"
      - "plugin.json"
      - "skills.sh.json"
      - ".agents/plugins/**"
      - ".github/workflows/ci-skills.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  skills:
    name: skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - name: Sync CLI (customer bea + upstream oracle)
        working-directory: cli
        run: uv sync --all-groups
      - name: Run skills checks
        # Customer leg: bea check with bean-* scrubbed from PATH.
        # Oracle leg: uv run --project cli bean-check (locked upstream).
        run: python3 scripts/skills/ci-check.py
      - name: Run ci-check unit tests
        run: python3 scripts/skills/test_ci_check.py
      - name: Run cookbook verifier tests
        run: python3 scripts/skills/test_verify_bql_cookbook.py
      - name: Run customer-suite installer and first-query tests
        run: python3 scripts/skills/test_beancount_skills.py
      - name: Run bea recipe tests against the published minimum bea
        # The step above runs the checkout's bea; customers run a release.
        # Install the minimum bea-cli.md declares and run the recipes on it.
        run: |
          minimum="$(python3 scripts/skills/ci-check.py --print-bea-minimum)"
          uv venv "$RUNNER_TEMP/published-bea"
          uv pip install --python "$RUNNER_TEMP/published-bea/bin/python" "beancount-io==$minimum"
          "$RUNNER_TEMP/published-bea/bin/bea" --version
          cd scripts/skills
          PATH="$RUNNER_TEMP/published-bea/bin:$PATH" SKILLS_BEA=published python3 -m unittest -v test_beancount_skills.TestBeaRecipes
      - name: Run development QA helper tests
        run: node --test .agents/skills/qa-shared/scripts/qa-login.test.mjs .agents/skills/qa-shared/scripts/qa-mcp.test.mjs

  installer-windows:
    # Installer evidence on native Windows, not proof that an agent discovers
    # the skills (that takes real agent sessions). No bea, secrets, network
    # clone, or model calls: the structural checks and bea recipes stay in the
    # Ubuntu job above.
    name: installer (Windows)
    runs-on: windows-latest
    defaults:
      run:
        # Windows PowerShell 5.1, the shell installation.md documents.
        shell: powershell
    steps:
      # No core.symlinks setting is needed: this job reads no committed link
      # (.claude/skills belongs to the Ubuntu gate) and creates its own.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record the host
        # Hosted Windows runners run as an administrator with UAC disabled, so
        # link creation should be allowed. The lifecycle test runs the guide's
        # symlink check and fails, rather than skips, if it is not.
        run: |
          [Environment]::OSVersion.VersionString
          "PowerShell $($PSVersionTable.PSVersion)"
          python --version
          git --version
          $principal = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          "elevated: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
      - name: Run the installer lifecycle tests
        # The guide's Windows PowerShell blocks as written (setup, install,
        # repeat install, update visibility, local edits, verify, conflict
        # recovery, removal) under paths with spaces and non-ASCII characters,
        # plus denied and interrupted link creation, injected so the runner's
        # own link permission cannot skip it. Any skip that is not a platform
        # skip fails the run.
        working-directory: scripts/skills
        run: python test_beancount_skills.py --installer
