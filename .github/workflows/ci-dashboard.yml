name: CI (dashboard)

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/ci-dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/ci-dashboard.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Enable Corepack (for Yarn 4 per package.json "packageManager") AFTER
      # setup-node, and don't use setup-node's `cache: yarn` — its cache probe
      # runs `yarn` before Corepack is enabled and fails on the global Yarn 1.x.
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn lint
      - run: yarn test
      # Explicit public API URL so production builds are deterministic without a
      # checked-in .env (VITE_API_URL is required for the browser Apollo client).
      - run: yarn build
        env:
          VITE_API_URL: https://beancount.io/api-gateway/
