fragment DiscoveryLedger on Ledger {
  id
  fullName
  description
  private
  isStarred
  permissions { pull push admin }
}

query DiscoverLedgers($q: String!, $page: Float!, $limit: Float!) {
  searchLedgers(q: $q, page: $page, limit: $limit, isPrivate: false, includeDesc: true) {
    ...DiscoveryLedger
  }
}

query MyDiscoveryLedgers($page: Float!, $limit: Float!) {
  listLedgers(page: $page, limit: $limit) { ...DiscoveryLedger }
}

query StarredDiscoveryLedgers($username: String!, $page: Float!, $limit: Float!) {
  getUserStarredRepos(username: $username, page: $page, limit: $limit) {
    total
    repositories { fullName description isPrivate }
  }
}

query DiscoveryIdentity($userId: String!) {
  userProfile(userId: $userId) { username }
}

mutation StarDiscoveryLedger($ledgerId: String!) {
  starLedger(ledgerId: $ledgerId) { success isStarred message }
}

mutation UnstarDiscoveryLedger($ledgerId: String!) {
  unstarLedger(ledgerId: $ledgerId) { success isStarred message }
}
