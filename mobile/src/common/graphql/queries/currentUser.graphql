fragment CurrentUserFields on UserProfileResponse {
  id
  email
  firstName
  lastName
  username
}

query CurrentUser {
  userProfile {
    ...CurrentUserFields
  }
}

# Separate from CurrentUser on purpose: servers that predate `avatarUrl`
# reject any query naming it, and the account's name and email must still load.
query CurrentUserAvatar {
  userProfile {
    id
    avatarUrl
  }
}

mutation UpdateProfile($firstName: String!, $lastName: String!) {
  updateProfile(firstName: $firstName, lastName: $lastName) {
    ...CurrentUserFields
  }
}

mutation UpdateUsername($username: String!) {
  updateUsername(username: $username) {
    ...CurrentUserFields
  }
}

# ADR026's saved currency preference. Separate for the same reason as
# CurrentUserAvatar: a server that predates the field rejects the query, and
# creation then simply suggests from the device.
query CurrentUserDefaultCurrency {
  userProfile {
    id
    defaultCurrency
  }
}

# Sent alone, it leaves the profile's names unchanged.
mutation UpdateDefaultCurrency($defaultCurrency: String) {
  updateProfile(defaultCurrency: $defaultCurrency) {
    id
    defaultCurrency
  }
}
