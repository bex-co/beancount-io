query SubscriptionStatus {
  userProfile {
    id
    tier
  }
  subscriptionStatus {
    hasActiveSubscription
    subscriptions {
      id
      status
      cancelAt
      cancelAtPeriodEnd
      currentPeriodEnd
      items {
        id
        price {
          id
          interval
        }
      }
      scheduledChange {
        effectiveAt
      }
    }
    billing {
      source
      store {
        provider
        tier
        interval
        accessEndsAt
        willRenew
        scheduledChange {
          tier
        }
      }
    }
  }
}
