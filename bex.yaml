# bex.yaml — beancount.io on bex (Render-compatible Blueprint).
#
# NOTE ON THE FILENAME. bex's own ADR049 makes `render.yaml` the canonical
# name and `bex.yml` (a .yml alias) the deprecated fallback; it states there
# is no application-level `bex.yaml`. So this name is NOT auto-discovered.
# It works because the deploy path posts the manifest inline --
# `POST /v1/blueprints/deploy` takes the file's CONTENTS, not its path -- and
# because an explicitly configured Blueprint path always wins over discovery.
# A Git-connected Blueprint left on default discovery would not find this
# file; point it at bex.yaml explicitly, or rename to render.yaml/bex.yml.
#
# Stateful pieces: two managed datastores plus Gitea's disk:
#
#   deploy/docker-mac compose -> here
#   ------------------------    ---------------------------------------------
#   dashboard               ->  beancount-dashboard   (web)
#   backend-v2              ->  beancount-api         (web)
#   ledger                  ->  beancount-ledger      (pserv, no public port)
#   postgres-backend        ->  beancount-backend-db  (managed Postgres)
#   redis                   ->  beancount-cache       (managed Key Value)
#   gitea                  ->  beancount-gitea       (web + 10 GB disk, 1 instance)
#   gitea's postgres        ->  a second schema (`gitea`) in the SAME managed
#                               Postgres instance -- one instance in total
#
# Gitea's repos need a filesystem, so it is the one service with a disk. Its
# first-boot administrator comes from deploy/bex/gitea/bex-entrypoint.sh.
#
# Services name no `repo` or `branch`: they build from the repository and branch
# this Blueprint is linked to, so a fork, or a copy you changed, deploys itself
# and not ours.
#
# The deploy asks for nothing. Every secret is generated (`generateValue`) and
# shared between services by copying (`fromService`), or derived at start from
# one that is (the OAuth signing key). Nothing secret is committed here.
# Optional integrations (model providers, asset storage) are not declared at
# all: add the ones you want afterwards, see deploy/bex/README.md.

services:
  # ---------------------------------------------------------------- dashboard
  - name: beancount-dashboard
    type: web
    runtime: docker
    rootDir: dashboard
    plan: starter
    healthCheckPath: /
    # SSR_API_URL is read at RUNTIME by src/config/config.server.ts. API_PROXY_URL
    # serves the API from this host too (dashboard/server/api-gateway-proxy.ts),
    # so the browser only ever talks to the dashboard's own origin; the
    # platform-assigned hostnames share no parent domain we own, so a sign-in
    # cookie cannot span a separate API host. The browser-facing URL is baked
    # from dashboard/.env.production instead, because Docker builds get no
    # build args.
    dockerCommand: sh -c 'export SSR_API_URL="http://$API_HOSTPORT/api-gateway/" API_PROXY_URL="http://$API_HOSTPORT"; exec node .output/server/index.mjs'
    envVars:
      # The API's internal address, as host:port. bex builds an internal address
      # from the service's slug, not its name, and the slug gets a suffix when
      # another workspace already holds the name, so it is never written down:
      # it is referenced here and put together in dockerCommand below. Port 4104
      # is the API's pinned PORT. An SSR pod cannot reach the backend through
      # its own ingress, so this must be the internal address.
      - key: API_HOSTPORT
        fromService:
          type: web
          name: beancount-api
          property: hostport

  # ---------------------------------------------------------------- backend-v2
  - name: beancount-api
    type: web
    runtime: docker
    rootDir: backend-cluster/backend-v2
    plan: starter
    # No healthCheckPath on purpose: /healthz is a DEEP check that 500s when
    # any dependency (including Gitea) is unreachable. As a platform probe it
    # would turn a transient Redis blip into a dead service. The port check is
    # the right liveness signal here.
    # Explicitly EMPTY, not omitted: an omitted field preserves whatever the
    # service already has (Render's create-vs-existing omission semantics), so
    # deleting the line would silently keep a previously-set command.
    preDeployCommand: ""
    # Migrations run at container start instead, because that is the only
    # place they can reach the database (see the preDeployCommand note below).
    # drizzle-orm's migrator is idempotent -- it applies only what the journal
    # says is pending -- and numInstances is 1, so there is no concurrent-
    # migration hazard. A failed migration crashloops the container rather
    # than silently serving against an unmigrated schema.
    # Internal addresses are referenced below (DASHBOARD_HOSTPORT,
    # LEDGER_HOSTPORT) and put together into URLs here, because bex builds them
    # from a slug that differs from the name when another workspace holds it.
    # First learn this deployment's public address from the dashboard, then
    # derive the OAuth signing key (see OAUTH_JWKS_FROM_AUTH_SECRET), migrate
    # (which also creates the schemas listed in ENSURE_SCHEMAS), then serve. `set -e` makes a failure to learn the address stop the container
    # instead of starting with the API's built-in default, which is
    # beancount.io's address.
    dockerCommand: sh -c 'set -e; export PUBLIC_URL_FROM="http://$DASHBOARD_HOSTPORT/_internal/public-url" FAVA_API_URL="http://$LEDGER_HOSTPORT"; out=$(node scripts/resolve-public-url.js); eval "$out"; out=$(node scripts/derive-oauth-jwks.js); eval "$out"; node scripts/migrate-deploy.js; exec yarn start'
    # Render's canonical use for preDeployCommand is a database
    # migration, but on bex the pre-deploy Job runs in BEX_BUILD_NAMESPACE
    # while the managed Postgres lives in the workspace namespace, and
    # cross-namespace traffic to a datastore ClusterIP is denied (ADR043 D8:
    # "A datastore ClusterIP is RFC1918, so it is denied -- connection
    # timeouts"). It fails with `connect ETIMEDOUT <clusterIP>:5432` after
    # burning the whole pre-deploy budget. Run `yarn migrate:deploy` from
    # inside a running instance instead (`bex ssh`), where the same-namespace
    # allow applies.
    envVars:
      # Pin the listener to the image's declared port (EXPOSE 4104): the
      # platform probes that port, and an injected PORT=3000 would leave the
      # rollout waiting forever on a port nothing listens on.
      - key: PORT
        value: "4104"
      # No public address is written here: the platform assigns the hostname,
      # and a second deployer of this Blueprint is given a different one when
      # the first choice is taken. At start, scripts/resolve-public-url.js asks
      # the dashboard (the one public entry point, which knows its own
      # RENDER_EXTERNAL_URL) at PUBLIC_URL_FROM, set in dockerCommand from
      # DASHBOARD_HOSTPORT, and derives DASHBOARD_URL (the OAuth issuer),
      # AUTH_COOKIE_DOMAIN (that host alone, never the shared .onbex.co) and
      # EXTRA_ALLOWED_ORIGINS. Set any of them yourself, for example behind a
      # custom domain, and your value is kept. SERVER_URL is not needed: in
      # production the issuer is DASHBOARD_URL.
      - key: DASHBOARD_HOSTPORT
        fromService:
          type: web
          name: beancount-dashboard
          property: hostport
      # Postgres schemas this stack needs besides the backend's own: Gitea shares
      # this database (one managed instance in total) and expects its own.
      # migrate-deploy.js creates it before Gitea can need it.
      - key: ENSURE_SCHEMAS
        value: gitea
      # This stack serves its operator's own users: sign-up needs no email
      # verification (there is no mail provider) and no plan limits apply.
      - key: SELF_HOST
        value: "true"

      # --- datastores -----------------------------------------------------
      - key: POSTGRES_BACKEND_URI
        fromDatabase:
          name: beancount-backend-db
          property: connectionString
      - key: REDIS_URI
        fromService:
          name: beancount-cache
          type: keyvalue
          property: connectionString

      # --- ledger service (private, same namespace) -----------------------
      # host:port, put together into FAVA_API_URL in dockerCommand (see there).
      - key: LEDGER_HOSTPORT
        fromService:
          type: pserv
          name: beancount-ledger
          property: hostport

      # --- generated secrets ----------------------------------------------
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECRETS
        generateValue: true
      # Generated once, then copied by beancount-ledger (its BACKEND_V2_ADMIN_TOKEN
      # is a fromService copy of this): the two must be byte-identical, and a
      # person should not have to invent one and paste it twice.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: METRICS_API_TOKEN
        generateValue: true
      # The OAuth authorization server's private signing key. Without one every
      # OAuth route answers 503, including the discovery document an MCP client
      # needs, and it is a P-256 key document rather than a random string, so
      # it cannot simply be generated. scripts/derive-oauth-jwks.js derives it
      # from AUTH_SECRET at start: stable across restarts, nothing extra to
      # store. Set OAUTH_JWKS yourself instead and yours is used.
      - key: OAUTH_JWKS_FROM_AUTH_SECRET
        value: "true"

      # --- Gitea ------------------------------------------------------------
      # Host is configured; credentials are not. Port 443 selects https via the
      # scheme derivation in src/config/config.ts, so an off-cluster Gitea works
      # (the old code hardcoded http://<host>:3000 and could not reach one).
      - key: GITEA_HOST_NAME
        fromService:
          type: web
          name: beancount-gitea
          property: host
      - key: GITEA_HTTP_PORT
        value: "3000"
      - key: FAVA_API_ADMIN_USER
        value: beancount_admin
      # Gitea generates this password once and creates the account with it; the
      # API presents the same one.
      - key: FAVA_API_ADMIN_PASSWORD
        fromService:
          type: web
          name: beancount-gitea
          envVarKey: FAVA_API_ADMIN_PASSWORD

      # Git-over-SSH terminates in this service's SSH proxy, which needs a TCP
      # listener the platform does not route to. Keep it off.
      - key: SSH_PROXY_ENABLED
        value: "false"

      # --- optional integrations: not asked for at deploy ---------------------
      # None of these is declared, so none is prompted for: the server boots
      # without them (LLM calls fail with a clear "LLM is not configured", asset
      # uploads are unavailable, the model proxy is unmetered). Add the ones you
      # want afterwards in the dashboard's Environment tab; they are listed in
      # deploy/bex/README.md. ANTHROPIC_BASE_URL must never be set to an empty
      # string (@ai-sdk/anthropic rejects it at import time).
      #
      # The S3 client is built at startup and throws "Region is missing"
      # without a region, so the regions stay declared.
      - key: TEMP_ASSETS_AWS_S3_REGION
        value: us-east-1
      - key: PERM_ASSETS_AWS_S3_REGION
        value: us-east-1

      - key: LOG_LEVEL
        value: info

  # ------------------------------------------------------------------- ledger
  - name: beancount-ledger
    type: pserv
    runtime: docker
    rootDir: backend-cluster/ledger
    plan: starter
    # Shallow by design (src/api/healthz.ts checks nothing downstream), so it
    # is safe as a platform probe — unlike the API's deep /healthz.
    healthCheckPath: /healthz
    envVars:
      - key: GITEA_HOST_NAME
        fromService:
          type: web
          name: beancount-gitea
          property: host
      - key: GITEA_HTTP_PORT
        value: "3000"
      - key: BACKEND_V2_HOST_NAME
        fromService:
          type: web
          name: beancount-api
          property: host
      - key: BACKEND_V2_HTTP_PORT
        value: "4104"
      # Must be byte-identical to beancount-api's ADMIN_TOKEN, so it is copied
      # from it. Left empty the directive-limit check fails OPEN (silently
      # skipped).
      - key: BACKEND_V2_ADMIN_TOKEN
        fromService:
          type: web
          name: beancount-api
          envVarKey: ADMIN_TOKEN
      - key: LOG_LEVEL
        value: info
      # Managed price includes (ADR 015) allow only https://beancount.io by
      # default; add MANAGED_PRICE_ORIGINS here only to widen, narrow, or
      # disable ("") remote price feeds.

  # -------------------------------------------------------------------- gitea
  # Ledger storage. Bare repos live on the disk; metadata lives in the SAME
  # managed Postgres instance as the backend, in a second database (`gitea`)
  # created once by deploy/bex/init-gitea-db.sql. Gitea connects as that
  # instance's single owner role -- bex cannot create a second role.
  - name: beancount-gitea
    type: web
    runtime: docker
    rootDir: deploy/bex/gitea
    plan: starter
    numInstances: 1
    healthCheckPath: /api/healthz
    disk:
      name: gitea-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: GITEA__database__DB_TYPE
        value: postgres
      - key: GITEA__database__HOST
        fromDatabase:
          name: beancount-backend-db
          property: host
      # The owner role cannot CREATE DATABASE on bex, so Gitea gets its own
      # SCHEMA in the backend's database instead (created once by
      # deploy/bex/init-gitea-db.sql). Backend tables stay in `public`.
      - key: GITEA__database__NAME
        value: backend
      - key: GITEA__database__SCHEMA
        value: gitea
      - key: GITEA__database__USER
        fromDatabase:
          name: beancount-backend-db
          property: user
      - key: GITEA__database__PASSWD
        fromDatabase:
          name: beancount-backend-db
          property: password
      - key: GITEA__database__SSL_MODE
        value: require
      # Shares one Postgres with the backend: cap the pool.
      - key: GITEA__database__MAX_OPEN_CONNS
        value: "20"
      - key: GITEA__database__MAX_IDLE_CONNS
        value: "5"
      - key: GITEA__database__CONN_MAX_LIFETIME
        value: 5m
      # GITEA__server__ROOT_URL and GITEA__server__DOMAIN are not set here:
      # deploy/bex/gitea/bex-entrypoint.sh derives them from the address bex
      # gives this service (RENDER_EXTERNAL_URL), unless you set them yourself.
      - key: GITEA__server__HTTP_PORT
        value: "3000"
      # No TCP routing on bex: Git-over-SSH is unavailable, HTTPS only.
      - key: GITEA__server__DISABLE_SSH
        value: "true"
      - key: GITEA__service__DISABLE_REGISTRATION
        value: "true"
      - key: GITEA__security__INSTALL_LOCK
        value: "true"
      - key: GITEA__security__SECRET_KEY
        generateValue: true
      - key: GITEA__security__INTERNAL_TOKEN
        generateValue: true
      - key: GITEA__server__LFS_JWT_SECRET
        generateValue: true
      - key: GITEA__oauth2__JWT_SECRET
        generateValue: true
      # First-boot administrator, read by deploy/bex/gitea/bex-entrypoint.sh.
      # The password is generated here once and copied by beancount-api, which
      # must present the same one.
      - key: FAVA_API_ADMIN_USER
        value: beancount_admin
      - key: FAVA_API_ADMIN_PASSWORD
        generateValue: true
      - key: GITEA_ADMIN_EMAIL
        value: admin@beancount.io

  # --------------------------------------------------------------- Key Value
  - name: beancount-cache
    type: keyvalue
    plan: starter
    # noeviction, NOT an LRU policy: this store holds auth tokens, so evicting
    # under memory pressure would silently log users out.
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: beancount-backend-db
    plan: basic-256mb
    databaseName: backend
    postgresMajorVersion: "16"
