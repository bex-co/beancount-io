# bex.yaml — beancount.io on bex (Render-compatible Blueprint).
#
# NOTE ON THE FILENAME. bex's own ADR049 makes `render.yaml` the canonical
# name and `bex.yml` (a .yml alias) the deprecated fallback; it states there
# is no application-level `bex.yaml`. So this name is NOT auto-discovered.
# It works because the deploy path posts the manifest inline --
# `POST /v1/blueprints/deploy` takes the file's CONTENTS, not its path -- and
# because an explicitly configured Blueprint path always wins over discovery.
# A Git-connected Blueprint left on default discovery would not find this
# file; point it at bex.yaml explicitly, or rename to render.yaml/bex.yml.
#
# Stateful pieces: two managed datastores plus Gitea's disk:
#
#   deploy/docker-mac compose -> here
#   ------------------------    ---------------------------------------------
#   dashboard               ->  beancount-dashboard   (web)
#   backend-v2              ->  beancount-api         (web)
#   ledger                  ->  beancount-ledger      (pserv, no public port)
#   postgres-backend        ->  beancount-backend-db  (managed Postgres)
#   redis                   ->  beancount-cache       (managed Key Value)
#   gitea                  ->  beancount-gitea       (web + 10 GB disk, 1 instance)
#   gitea's postgres        ->  a second schema (`gitea`) in the SAME managed
#                               Postgres instance -- one instance in total
#
# Gitea's repos need a filesystem, so it is the one service with a disk. Its
# first-boot administrator comes from deploy/bex/gitea/bex-entrypoint.sh.
#
# Secrets are declared `sync: false` (seed once, then edit in the dashboard) or
# `generateValue`. Nothing secret is committed here. Until the Gitea admin
# credentials are seeded the API cannot authenticate to Gitea at all, so a
# fresh deploy cannot touch ledger data by accident.

services:
  # ---------------------------------------------------------------- dashboard
  - name: beancount-dashboard
    type: web
    runtime: docker
    repo: https://github.com/bex-co/beancount-io
    branch: bex-deploy
    rootDir: dashboard
    plan: starter
    healthCheckPath: /
    envVars:
      # Read at RUNTIME by src/config/config.server.ts. Must be the internal
      # address: an SSR pod cannot reach the backend through its own ingress.
      #
      # Port 3000, not the Dockerfile's 4104: the platform injects PORT (App
      # CRD `port`, default 3000) and a runtime env var beats the image ENV, so
      # every service listens on 3000 and its internal address is <slug>:3000.
      # The Blueprint schema rejects a `port` field, so 3000 is not negotiable.
      # The browser-facing URL is baked from dashboard/.env.production instead,
      # because Docker builds get no build args.
      - key: SSR_API_URL
        value: http://beancount-api:4104/api-gateway/
      # Serve the API from this host too (dashboard/server/api-gateway-proxy.ts)
      # so the browser only ever talks to the dashboard's own origin. The
      # platform-assigned *.onbex.co hostnames share no parent domain we own,
      # so a sign-in cookie cannot span a separate API host. Unset = inert.
      - key: API_PROXY_URL
        value: http://beancount-api:4104

  # ---------------------------------------------------------------- backend-v2
  - name: beancount-api
    type: web
    runtime: docker
    repo: https://github.com/bex-co/beancount-io
    branch: bex-deploy
    rootDir: backend-cluster/backend-v2
    plan: starter
    # No healthCheckPath on purpose: /healthz is a DEEP check that 500s when
    # any dependency (including Gitea) is unreachable. As a platform probe it
    # would turn a transient Redis blip into a dead service. The port check is
    # the right liveness signal here.
    # Explicitly EMPTY, not omitted: an omitted field preserves whatever the
    # service already has (Render's create-vs-existing omission semantics), so
    # deleting the line would silently keep a previously-set command.
    preDeployCommand: ""
    # Migrations run at container start instead, because that is the only
    # place they can reach the database (see the preDeployCommand note below).
    # drizzle-orm's migrator is idempotent -- it applies only what the journal
    # says is pending -- and numInstances is 1, so there is no concurrent-
    # migration hazard. A failed migration crashloops the container rather
    # than silently serving against an unmigrated schema.
    dockerCommand: sh -c "node scripts/migrate-deploy.js && yarn start"
    # Render's canonical use for preDeployCommand is a database
    # migration, but on bex the pre-deploy Job runs in BEX_BUILD_NAMESPACE
    # while the managed Postgres lives in the workspace namespace, and
    # cross-namespace traffic to a datastore ClusterIP is denied (ADR043 D8:
    # "A datastore ClusterIP is RFC1918, so it is denied -- connection
    # timeouts"). It fails with `connect ETIMEDOUT <clusterIP>:5432` after
    # burning the whole pre-deploy budget. Run `yarn migrate:deploy` from
    # inside a running instance instead (`bex ssh`), where the same-namespace
    # allow applies.
    envVars:
      # Pin the listener to the image's declared port (EXPOSE 4104): the
      # platform probes that port, and an injected PORT=3000 would leave the
      # rollout waiting forever on a port nothing listens on.
      - key: PORT
        value: "4104"
      - key: SERVER_URL
        value: https://beancount-api.onbex.co
      - key: DASHBOARD_URL
        value: https://beancount-dashboard.onbex.co
      # The browser reaches this API through the dashboard host (see
      # API_PROXY_URL above), so the sign-in cookie is scoped to that host alone
      # -- not to .onbex.co, which every bex tenant shares.
      - key: AUTH_COOKIE_DOMAIN
        value: beancount-dashboard.onbex.co
      # Direct calls to this API from the dashboard origin; CORS only trusts
      # *.beancount.io by default (src/server/api/allowed-origin.ts).
      - key: EXTRA_ALLOWED_ORIGINS
        value: https://beancount-dashboard.onbex.co
      # No mail provider on this canary: sign-up sends no code and accepts any
      # code for a valid session. Remove once SEND_GRID_API_KEY is set.
      - key: AUTH_SKIP_EMAIL_VERIFICATION
        value: "true"

      # --- datastores -----------------------------------------------------
      - key: POSTGRES_BACKEND_URI
        fromDatabase:
          name: beancount-backend-db
          property: connectionString
      - key: REDIS_URI
        fromService:
          name: beancount-cache
          type: keyvalue
          property: connectionString

      # --- ledger service (private, same namespace) -----------------------
      # :3000 for the same injected-PORT reason as SSR_API_URL above.
      - key: FAVA_API_URL
        value: http://beancount-ledger:8000

      # --- generated secrets ----------------------------------------------
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECRETS
        generateValue: true
      # sync:false rather than generateValue: the ledger has to present the SAME
      # token, and fromService.envVarKey cannot reference a generated value
      # ("no such plainly-defined variable"). Seed one strong value into BOTH
      # this and beancount-ledger's BACKEND_V2_ADMIN_TOKEN.
      - key: ADMIN_TOKEN
        sync: false
      - key: METRICS_API_TOKEN
        generateValue: true
      # The OAuth authorization server's private signing JWKS. sync:false, not
      # generateValue: it is a complete P-256/ES256 private JWKS document, not a
      # random string, and rotating it invalidates every live access token.
      #
      # Not optional in practice. Without it `src/features/oauth/api/oidc-route.ts`
      # replaces every OAuth route with a 503 `oauth_not_configured`, including
      # `/.well-known/oauth-protected-resource` — the URL the MCP endpoint's 401
      # names in WWW-Authenticate. An MCP client then discovers nothing and
      # cannot authenticate at all. Generate per backend-v2's README.
      - key: OAUTH_JWKS
        sync: false

      # --- Gitea ------------------------------------------------------------
      # Host is configured; credentials are not. Port 443 selects https via the
      # scheme derivation in src/config/config.ts, so an off-cluster Gitea works
      # (the old code hardcoded http://<host>:3000 and could not reach one).
      - key: GITEA_HOST_NAME
        value: beancount-gitea
      - key: GITEA_HTTP_PORT
        value: "3000"
      - key: EXTERNAL_GITEA_HOST_NAME
        value: beancount-gitea.onbex.co
      - key: EXTERNAL_GITEA_HTTP_PORT
        value: "443"
      - key: FAVA_API_ADMIN_USER
        value: beancount_admin
      - key: FAVA_API_ADMIN_PASSWORD
        sync: false

      # Git-over-SSH terminates in this service's SSH proxy, which needs a TCP
      # listener the platform does not route to. Keep it off.
      - key: SSH_PROXY_ENABLED
        value: "false"

      # --- LLM / integrations (seed once, then edit in the dashboard) --------
      # ANTHROPIC_BASE_URL is deliberately NOT declared: an empty string is
      # fatal at import time (@ai-sdk/anthropic rejects a non-string baseURL).
      #
      # All LLM vars are optional (ADR 0011): the server boots with none set
      # and AI calls fail with a clear "LLM is not configured" error. Set
      # ANTHROPIC_API_KEY (primary) / OPENAI_API_KEY (fallback) to enable AI
      # features; BLOCKEDEN_ACCESS_KEY only meters the `bea ask` model proxy.
      - key: BLOCKEDEN_ACCESS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Optional model overrides; defaults are claude-sonnet-4-5 / gpt-4o. Not
      # ANTHROPIC_MODEL — that name belongs to the Ask-AI sandbox path.
      - key: LLM_MODEL
        sync: false
      - key: LLM_FALLBACK_MODEL
        sync: false

      # --- asset storage ----------------------------------------------------
      # A region is required even when unset: the S3 client is built at startup
      # and throws "Region is missing" without one.
      - key: TEMP_ASSETS_AWS_S3_REGION
        value: us-east-1
      - key: PERM_ASSETS_AWS_S3_REGION
        value: us-east-1
      - key: TEMP_ASSETS_AWS_S3_BUCKET
        sync: false
      - key: TEMP_ASSETS_AWS_S3_ACCESS_KEY_ID
        sync: false
      - key: TEMP_ASSETS_AWS_S3_SECRET_ACCESS_KEY
        sync: false
      - key: PERM_ASSETS_AWS_S3_BUCKET
        sync: false
      - key: PERM_ASSETS_AWS_S3_ACCESS_KEY_ID
        sync: false
      - key: PERM_ASSETS_AWS_S3_SECRET_ACCESS_KEY
        sync: false

      - key: LOG_LEVEL
        value: info

  # ------------------------------------------------------------------- ledger
  - name: beancount-ledger
    type: pserv
    runtime: docker
    repo: https://github.com/bex-co/beancount-io
    branch: bex-deploy
    rootDir: backend-cluster/ledger
    plan: starter
    # Shallow by design (src/api/healthz.ts checks nothing downstream), so it
    # is safe as a platform probe — unlike the API's deep /healthz.
    healthCheckPath: /healthz
    envVars:
      - key: GITEA_HOST_NAME
        value: beancount-gitea
      - key: GITEA_HTTP_PORT
        value: "3000"
      - key: BACKEND_V2_HOST_NAME
        value: beancount-api
      - key: BACKEND_V2_HTTP_PORT
        value: "4104"
      # Must be byte-identical to beancount-api's ADMIN_TOKEN. Left empty the
      # directive-limit check fails OPEN (silently skipped), so seed it.
      - key: BACKEND_V2_ADMIN_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: info
      # Managed price includes (ADR 015) allow only https://beancount.io by
      # default; add MANAGED_PRICE_ORIGINS here only to widen, narrow, or
      # disable ("") remote price feeds.

  # -------------------------------------------------------------------- gitea
  # Ledger storage. Bare repos live on the disk; metadata lives in the SAME
  # managed Postgres instance as the backend, in a second database (`gitea`)
  # created once by deploy/bex/init-gitea-db.sql. Gitea connects as that
  # instance's single owner role -- bex cannot create a second role.
  - name: beancount-gitea
    type: web
    runtime: docker
    repo: https://github.com/bex-co/beancount-io
    branch: bex-deploy
    rootDir: deploy/bex/gitea
    plan: starter
    numInstances: 1
    healthCheckPath: /api/healthz
    disk:
      name: gitea-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: GITEA__database__DB_TYPE
        value: postgres
      - key: GITEA__database__HOST
        fromDatabase:
          name: beancount-backend-db
          property: host
      # The owner role cannot CREATE DATABASE on bex, so Gitea gets its own
      # SCHEMA in the backend's database instead (created once by
      # deploy/bex/init-gitea-db.sql). Backend tables stay in `public`.
      - key: GITEA__database__NAME
        value: backend
      - key: GITEA__database__SCHEMA
        value: gitea
      - key: GITEA__database__USER
        fromDatabase:
          name: beancount-backend-db
          property: user
      - key: GITEA__database__PASSWD
        fromDatabase:
          name: beancount-backend-db
          property: password
      - key: GITEA__database__SSL_MODE
        value: require
      # Shares one Postgres with the backend: cap the pool.
      - key: GITEA__database__MAX_OPEN_CONNS
        value: "20"
      - key: GITEA__database__MAX_IDLE_CONNS
        value: "5"
      - key: GITEA__database__CONN_MAX_LIFETIME
        value: 5m
      - key: GITEA__server__DOMAIN
        value: beancount-gitea.onbex.co
      - key: GITEA__server__ROOT_URL
        value: https://beancount-gitea.onbex.co/
      - key: GITEA__server__HTTP_PORT
        value: "3000"
      # No TCP routing on bex: Git-over-SSH is unavailable, HTTPS only.
      - key: GITEA__server__DISABLE_SSH
        value: "true"
      - key: GITEA__service__DISABLE_REGISTRATION
        value: "true"
      - key: GITEA__security__INSTALL_LOCK
        value: "true"
      - key: GITEA__security__SECRET_KEY
        generateValue: true
      - key: GITEA__security__INTERNAL_TOKEN
        generateValue: true
      - key: GITEA__server__LFS_JWT_SECRET
        generateValue: true
      - key: GITEA__oauth2__JWT_SECRET
        generateValue: true
      # First-boot administrator, read by deploy/bex/gitea/bex-entrypoint.sh.
      # The password must equal beancount-api's FAVA_API_ADMIN_PASSWORD.
      - key: FAVA_API_ADMIN_USER
        value: beancount_admin
      - key: FAVA_API_ADMIN_PASSWORD
        sync: false
      - key: GITEA_ADMIN_EMAIL
        value: admin@beancount.io

  # --------------------------------------------------------------- Key Value
  - name: beancount-cache
    type: keyvalue
    plan: starter
    # noeviction, NOT an LRU policy: this store holds auth tokens, so evicting
    # under memory pressure would silently log users out.
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: beancount-backend-db
    plan: basic-256mb
    databaseName: backend
    postgresMajorVersion: "16"
