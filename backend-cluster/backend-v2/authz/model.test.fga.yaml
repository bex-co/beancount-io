# Behavioral assertions for the durable relationship model. The OpenFGA CLI
# evaluates this file with its embedded engine; no server is required.
#
# This suite intentionally contains no credentials, token scopes, request
# tuples, or authentication assurance. Those belong to the centralized PDP's
# signed subject/grant evaluation, not the OpenFGA relationship graph.
name: backend-v2 durable authorization relationships
model_file: ./model.fga

tuples:
  # A user is both the subject and the protected User resource. The tuple
  # writer must only create matching ownership links.
  - user: user:usr_alice
    relation: owner
    object: user:usr_alice
  - user: user:usr_bob
    relation: owner
    object: user:usr_bob

  # Private ledger with one collaborator at each rank.
  - user: user:usr_alice
    relation: owner
    object: ledger:alice/main
  - user: user:usr_adam
    relation: collaborator_admin
    object: ledger:alice/main
  - user: user:usr_bob
    relation: collaborator_write
    object: ledger:alice/main
  - user: user:usr_carol
    relation: collaborator_read
    object: ledger:alice/main

  # Public ledger: only the wildcard may be a public_reader.
  - user: user:usr_alice
    relation: owner
    object: ledger:alice/blog
  - user: "user:*"
    relation: public_reader
    object: ledger:alice/blog

tests:
  - name: user has every permission family on its own resource
    check:
      - user: user:usr_alice
        object: user:usr_alice
        assertions:
          can_read_profile: true
          can_write_profile: true
          can_read_credentials: true
          can_write_credentials: true
          can_read_billing: true
          can_write_billing: true
          can_write_lifecycle: true
          can_read_social: true
          can_write_social: true
          can_write_ledgers: true
          can_read_ledgers: true
          can_read_public_keys: true
          can_write_public_keys: true

  # Runtime API-key list/create/revoke resolve back to these User credential
  # permissions. The key itself deliberately is not an FGA entity.
  - name: API-key management derives from the owner's User permission
    check:
      - user: user:usr_alice
        object: user:usr_alice
        assertions:
          can_read_credentials: true
          can_write_credentials: true
      - user: user:usr_bob
        object: user:usr_alice
        assertions:
          can_read_credentials: false
          can_write_credentials: false

  - name: user permissions do not cross ownership boundaries
    check:
      - user: user:usr_alice
        object: user:usr_bob
        assertions:
          can_read_profile: false
          can_write_profile: false
          can_read_credentials: false
          can_write_credentials: false
          can_read_billing: false
          can_write_billing: false
          can_write_lifecycle: false
          can_read_social: false
          can_write_social: false
          can_write_ledgers: false
          can_read_ledgers: false
          can_read_public_keys: false
          can_write_public_keys: false
      - user: user:usr_dave
        object: user:usr_alice
        assertions:
          can_read_profile: false
          can_write_profile: false
          can_write_lifecycle: false
          can_write_ledgers: false
          can_read_ledgers: false
          can_read_public_keys: false
          can_write_public_keys: false

  - name: ledger owner has every ledger relationship permission
    check:
      - user: user:usr_alice
        object: ledger:alice/main
        assertions:
          reader: true
          writer: true
          administrator: true
          can_read_contents: true
          can_write_contents: true
          can_read_administration: true
          can_write_administration: true
          can_read_collaborators: true
          can_write_collaborators: true
          can_leave: false
          can_read_bank_connections: true
          can_write_bank_connections: true
          can_read_assets: true
          can_write_assets: true
          can_write_ai: true

  - name: admin collaborator has the ledger control-plane relationship
    check:
      - user: user:usr_adam
        object: ledger:alice/main
        assertions:
          reader: true
          writer: true
          administrator: true
          can_read_contents: true
          can_write_contents: true
          can_write_administration: true
          can_write_collaborators: true
          can_leave: true
          can_write_bank_connections: true

  - name: write collaborator cannot cross into ledger administration
    check:
      - user: user:usr_bob
        object: ledger:alice/main
        assertions:
          reader: true
          writer: true
          administrator: false
          can_read_contents: true
          can_write_contents: true
          can_read_administration: false
          can_write_administration: false
          can_write_collaborators: false
          can_leave: true
          can_write_bank_connections: false
          can_write_assets: true
          can_write_ai: true

  - name: read collaborator has read-only domain relationships
    check:
      - user: user:usr_carol
        object: ledger:alice/main
        assertions:
          reader: true
          writer: false
          administrator: false
          can_read_contents: true
          can_write_contents: false
          can_read_assets: true
          can_write_assets: false
          can_write_administration: false
          can_leave: true

  - name: stranger has no relationship permission on a private ledger
    check:
      - user: user:usr_dave
        object: ledger:alice/main
        assertions:
          reader: false
          writer: false
          administrator: false
          can_read_contents: false
          can_write_contents: false
          can_write_administration: false
          can_leave: false

  - name: anonymous and signed-in strangers read a public ledger only
    check:
      - user: user:anonymous
        object: ledger:alice/blog
        assertions:
          reader: true
          writer: false
          administrator: false
          can_read_contents: true
          can_read_assets: true
          can_write_administration: false
          can_leave: false
      - user: user:usr_dave
        object: ledger:alice/blog
        assertions:
          reader: true
          writer: false
          administrator: false
          can_read_contents: true
          can_leave: false
      - user: user:anonymous
        object: ledger:alice/main
        assertions:
          reader: false
          writer: false
          administrator: false
          can_read_contents: false

  - name: adding weaker durable facts never lowers an existing rank
    tuples:
      - user: user:usr_alice
        relation: collaborator_read
        object: ledger:alice/main
      - user: user:usr_bob
        relation: collaborator_read
        object: ledger:alice/main
    check:
      - user: user:usr_alice
        object: ledger:alice/main
        assertions:
          reader: true
          writer: true
          administrator: true
      - user: user:usr_bob
        object: ledger:alice/main
        assertions:
          reader: true
          writer: true
          administrator: false
